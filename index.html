var WKS=[
{wk:1,m:1,ph:"Foundation",pillar:"🔧 The Engineer's Mind",li:{ty:"Text Post",ti:"Profile Launch + Soft Intro",hk:"I spent my first month at Hindustan Aeronautics Limited folding drawings.",cp:"I spent my first month at Hindustan Aeronautics Limited folding drawings.\n\nNot designing. Not engineering. Folding.\n\nPaper sizes. Filing systems. Reading blueprints someone else made. I remember thinking \u2014 what am I even doing here?\n\nBut here\u2019s what that month actually taught me:\n\nBefore you build anything, you need to understand the foundation someone else laid. Before you design, you need to read. Before you lead, you need to listen.\n\n25 years later, I still fold before I build.\n\nWhether it\u2019s a business, a team, or a relationship \u2014 I don\u2019t start with the answer. I start by understanding every piece of the machine.\n\nWhat was your \u201Cfolding drawings\u201D moment?",ds:{format:"Text-only post (no image needed \u2014 the story carries it)",visual:"Clean. No graphic. Let LinkedIn\u2019s native text formatting do the work.",palette:"N/A \u2014 pure text post performs best for personal stories",font:"LinkedIn default. Line breaks for mobile readability.",cta:"End with an open question to drive comments"},ht:"#Leadership #Engineering #CareerLessons #FirstJob"},wa:[{d:"Mon",c:"\u201CBefore you build, learn to fold.\u201D \u2014 something I learned at HAL 25 years ago.",s:"Dark charcoal bg (#1A1A1A). White serif text. Minimal."},{d:"Tue",c:"Photo of AK at workspace \u2014 candid. Caption: \u201CDay 1 of sharing what I\u2019ve learned.\u201D",s:"Real photo. No filter. White text overlay at bottom."},{d:"Wed",c:"\u201CThe best engineers I know don\u2019t start with solutions. They start with questions.\u201D",s:"Warm cream bg (#F5F0E6). Dark brown text. Centered."},{d:"Thu",c:"Throwback: Photo from BITS Pilani days. \u201CWhere it all started.\u201D",s:"Old photo. Warm tone. Small white caption."},{d:"Fri",c:"\u201CGrateful for [Name] who taught me patience isn\u2019t passive \u2014 it\u2019s strategic.\u201D",s:"Soft green bg (#E8F5E9). Dark text."},{d:"Sat",c:"Weekend wildlife photography. No caption.",s:"Full photo. Authentic."}]},
{wk:2,m:1,ph:"Foundation",pillar:"🔧 The Engineer's Mind",li:{ty:"Carousel (6 slides)",ti:"The CNC Factory Summers",hk:"Every vacation, while other kids played, I disappeared into a CNC factory.",cp:"[SLIDE 1 \u2014 Cover]\n\u201CThe Boy in the Factory\u201D\nHow summer vacations shaped my engineering mind\n\n[SLIDE 2]\nEvery year, two months in Bangalore. My cousin owned a CNC factory. I\u2019d show up at dawn and stay till they locked the gates.\n\n[SLIDE 3]\nI didn\u2019t understand half of what I saw. But I watched. I asked questions that probably annoyed everyone.\n\n[SLIDE 4]\nThat factory taught me: the world is a machine. Every problem has parts. Understand the parts, fix anything.\n\n[SLIDE 5]\n25 years later, I still approach every challenge the same way \u2014 dismantle, understand, rebuild better.\n\n[SLIDE 6 \u2014 CTA]\nWhat shaped your thinking before your career started?",ds:{format:"Carousel \u2014 6 slides, swipeable",visual:"Editorial. Solid background + text per slide. No stock images.",palette:"Slide 1: Navy (#1a2744) + gold. Slides 2-5: Off-white (#FAF8F5). Slide 6: Gold (#B8860B) + white.",font:"Headlines: Playfair Display, 28-32px. Body: DM Sans, 16-18px.",cta:"Final slide asks a question + AK signature"},ht:"#SystemsThinking #Engineering #Curiosity"},wa:[{d:"Mon",c:"\u201CThe world is a machine. Every problem has parts.\u201D \u2014 a CNC factory taught me at 14.",s:"Navy bg. Gold text. Centered."},{d:"Tue",c:"New carousel on LinkedIn \u2014 the summers that shaped how I think.",s:"Carousel cover preview."},{d:"Wed",c:"Meeting photo. \u201CSome problems need a whiteboard. Most need a conversation.\u201D",s:"Real photo. White text overlay."},{d:"Thu",c:"\u201CI used to dismantle toys. Now I do the same with business problems.\u201D",s:"Warm beige bg. Dark serif text."},{d:"Fri",c:"Shoutout: \u201CIf you haven\u2019t connected with [colleague], you should.\u201D",s:"Sage green bg. Dark text."},{d:"Sat",c:"Wildlife photo. No text.",s:"Full photo. No overlay."}]},
{wk:3,m:1,ph:"Foundation",pillar:"✈️ 25 Years, Zero Shortcuts",li:{ty:"Text Post + Image",ti:"The Drawing Folder",hk:"My first assignment as a design engineer at HAL: learn to fold drawings.",cp:"My first assignment as a design engineer at HAL: learn to fold drawings.\n\nFor a month.\n\nWeek 1: Paper sizes and folding techniques.\nWeek 2: Filing systems. Fetching drawings for senior designers.\nWeek 3: Reading drawings I didn\u2019t create.\nWeek 4: Asking so many questions they probably regretted hiring me.\n\nI was frustrated. I had a degree. I wanted to design. Instead, I was folding paper.\n\nBut that month gave me something no textbook could:\n\n\u2192 Respect for the work that came before me\n\u2192 The patience to learn before trying to lead\n\u2192 The confidence to ask \u201Cwhy\u201D until I truly understood\n\nThe best careers aren\u2019t built on shortcuts.\n\nWhat\u2019s your \u201Cfolding drawings\u201D story?",ds:{format:"Text post with optional single image",visual:"Minimal graphic: quote on dark background. Or pure text.",palette:"Charcoal (#2D2D2D), cream text (#FAF8F5), gold line accent",font:"Serif heading, sans-serif subtext. Large whitespace.",cta:"Direct question. Reply to every comment."},ht:"#Patience #Engineering #HAL #CareerGrowth"},wa:[{d:"Mon",c:"\u201CLearn to fold before you build.\u201D \u2014 My first lesson at HAL.",s:"Black bg. White text. One line."},{d:"Tue",c:"Workspace photo. \u201CStill folding. Still learning. 25 years later.\u201D",s:"Real photo. Warm tone. Small text."},{d:"Wed",c:"\u201CThe best careers aren\u2019t built on shortcuts.\u201D",s:"Cream bg. Dark brown serif text."},{d:"Thu",c:"Old photo from engineering days. \u201C2001. The drawing board.\u201D",s:"Throwback. Warm filter."},{d:"Fri",c:"\u201CConnected two incredible people this week. Nothing beats the right conversation.\u201D",s:"Soft blue bg (#E3F2FD). Dark text."},{d:"Sat",c:"Nature/wildlife shot.",s:"Full photo."}]},
{wk:4,m:1,ph:"Foundation",pillar:"🤝 The Catalyst",li:{ty:"People Spotlight",ti:"First Catalyst Story",hk:"Three years ago, someone told me about a young engineer who couldn\u2019t get a break.",cp:"Three years ago, someone told me about a young engineer who couldn\u2019t get a break.\n\nGreat skills. Wrong connections. No one to vouch for him.\n\nI made one phone call. Introduced him to someone who was hiring.\n\nThat \u201Cyoung engineer\u201D is now leading a team of 15.\n\nI didn\u2019t mentor him. I didn\u2019t coach him.\n\nI just connected the right person with the right opportunity at the right time.\n\nIt\u2019s not about what you build. It\u2019s about who you put in the room.\n\nTag someone who gave YOU that one introduction that changed everything.",ds:{format:"Text post \u2014 pure storytelling. No image.",visual:"Let the narrative carry it. Human stories are LinkedIn gold.",palette:"N/A \u2014 native text",font:"Short paragraphs. One-line sentences for impact.",cta:"Double CTA: Tag someone + share their story."},ht:"#PeopleFirst #Catalyst #Mentorship"},wa:[{d:"Mon",c:"\u201CIt\u2019s not about what you build. It\u2019s about who you put in the room.\u201D",s:"Dark slate bg (#334155). White text."},{d:"Tue",c:"New LinkedIn post \u2014 one phone call that changed someone\u2019s career.",s:"Cream bg. Teaser."},{d:"Wed",c:"Photo with a colleague. \u201CGood conversations > good presentations.\u201D",s:"Real photo. White text overlay."},{d:"Thu",c:"\u201CSomeone once made a phone call that changed my career. Paying it forward.\u201D",s:"Terracotta bg (#D4A574). Dark text."},{d:"Fri",c:"\u201CIn [industry] looking for [role]? DM me. I might know someone.\u201D",s:"White bg. Bold dark text."},{d:"Sat",c:"Weekend photo.",s:"Authentic."}]},
{wk:5,m:2,ph:"Momentum",pillar:"🎯 First Principles Thinker",li:{ty:"Framework Post + Graphic",ti:"The Machine Thinker",hk:"I can\u2019t solve a problem unless I see the whole machine.",cp:"I can\u2019t solve a problem unless I see the whole machine.\n\nWhen someone brings me a challenge \u2014 a broken process, a team conflict \u2014 I don\u2019t jump to the fix.\n\nI dismantle it.\n\nMy framework (from 4 years designing aero engine test beds at HAL):\n\n1. MAP THE MACHINE \u2192 What are ALL the moving parts?\n2. FIND THE FRICTION \u2192 Where is energy being wasted?\n3. TRACE THE CONNECTIONS \u2192 How does Part A affect Part B, C, D?\n4. REBUILD FROM FIRST PRINCIPLES \u2192 Don\u2019t patch. Redesign.\n\nWhen one mistake can cost lives \u2014 you don\u2019t guess. You understand.\n\nWhat\u2019s your go-to framework for complex problems?",ds:{format:"Text + graphic showing 4-step framework",visual:"Clean infographic. 4 steps vertical flow.",palette:"White bg, dark text. Gold (#B8860B) step numbers.",font:"Steps: Playfair 48px gold. Titles: Bold sans 18px.",cta:"Question at end. Share as carousel if engagement is strong."},ht:"#SystemsThinking #ProblemSolving #Framework"},wa:[{d:"Mon",c:"\u201CDon\u2019t fix the symptom. Understand the machine.\u201D",s:"Charcoal bg. White text."},{d:"Tue",c:"Shared a 25-year-old framework on LinkedIn. From test beds where mistakes cost lives.",s:"Framework graphic preview."},{d:"Wed",c:"Desk/whiteboard photo. \u201CThis is what my Monday looks like.\u201D",s:"Candid photo. White text."},{d:"Thu",c:"\u201CThe best leaders don\u2019t have all the answers. They have better questions.\u201D",s:"Navy bg (#1E3A5F). White serif text."},{d:"Fri",c:"\u201CIntroduced [A] to [B] today. Sometimes just let two smart people talk.\u201D",s:"Sage green bg."},{d:"Sat",c:"Wildlife/nature photo.",s:"Full frame."}]},
{wk:6,m:2,ph:"Momentum",pillar:"🔧 The Engineer's Mind",li:{ty:"Opinion/Industry Post",ti:"Innovation vs. Maintenance",hk:"Everyone talks about innovation. Almost nobody talks about maintenance.",cp:"Everyone talks about innovation. Almost nobody talks about maintenance.\n\nAt HAL: 100% safety wasn\u2019t a target \u2014 it was the minimum.\n\nReal innovation isn\u2019t about the new thing. It\u2019s about understanding the existing thing so deeply you know where to improve.\n\nThree types of design:\n\u2192 Reverse engineering (understanding what exists)\n\u2192 Incremental design (improving what exists)\n\u2192 New product design (creating what doesn\u2019t exist)\n\nMost people skip to #3. The best engineers master #1 first.\n\nIs the obsession with \u201Cdisruption\u201D causing us to neglect deep understanding?",ds:{format:"Text post. Optional: pyramid graphic of 3 design types",visual:"Clean pyramid. 3 layers. Gold accent.",palette:"Off-white bg. Dark text. Gold for hierarchy.",font:"Sans-serif body. Serif for design type labels.",cta:"Provocative question sparks debate."},ht:"#Innovation #Engineering #DesignThinking"},wa:[{d:"Mon",c:"\u201CReal innovation = understanding the existing thing deeply enough to improve it.\u201D",s:"Cream bg. Dark serif text."},{d:"Tue",c:"Posted something spicy on LinkedIn today.",s:"Light gray bg. Teaser."},{d:"Wed",c:"Work photo. \u201CWhiteboard session ran 3 hours. Best kind of meeting.\u201D",s:"Real photo. Small caption."},{d:"Thu",c:"\u201CReverse engineer \u2192 Improve \u2192 Create. Don\u2019t skip step 1.\u201D",s:"White bg. Bold dark text."},{d:"Fri",c:"\u201C[Name] has been doing incredible work in [space]. Follow them.\u201D",s:"Soft bg. Recommendation."},{d:"Sat",c:"Personal photo.",s:"Authentic."}]},
{wk:7,m:2,ph:"Momentum",pillar:"🤝 The Catalyst",li:{ty:"People Spotlight #2",ti:"Second Catalyst Story",hk:"She had the skills. She didn\u2019t have the room.",cp:"She had the skills. She didn\u2019t have the room.\n\nA product manager at an event. Sharp thinking. Stuck in a role below her potential.\n\nI asked: \u201CIf you could work anywhere, what would you build?\u201D\n\nOne introduction later, she\u2019s leading product for a team that\u2019s tripled.\n\nI didn\u2019t do the work. She did. I just opened a door.\n\n\u2192 Talent is everywhere. Opportunity is not.\n\u2192 Believe in someone before they\u2019ve proven themselves.\n\u2192 One right introduction > 100 motivational speeches.\n\nWho in your network deserves a door opened? Tag them.",ds:{format:"Text post \u2014 storytelling. No image.",visual:"Pure text. Human stories are gold.",palette:"N/A",font:"Short paragraphs. Arrow (\u2192) for takeaways.",cta:"Tag prompt drives massive reach."},ht:"#Talent #Opportunity #PeopleFirst #Catalyst"},wa:[{d:"Mon",c:"\u201CTalent is everywhere. Opportunity is not. Be the bridge.\u201D",s:"Dark teal bg (#134E4A). White text."},{d:"Tue",c:"Story on LinkedIn about one introduction that changed a career.",s:"Cream bg. Teaser."},{d:"Wed",c:"Coffee meeting photo. \u201CBest meetings happen without agendas.\u201D",s:"Real photo. Warm tones."},{d:"Thu",c:"\u201CBefore I introduce two people: will this make both better?\u201D",s:"Amber bg (#FEF3C7). Dark text."},{d:"Fri",c:"\u201CLooking for [role] for a startup. DM me.\u201D",s:"White bg. Bold. Actionable."},{d:"Sat",c:"Weekend.",s:"Photo. No text."}]},
{wk:8,m:2,ph:"Momentum",pillar:"✈️ 25 Years, Zero Shortcuts",li:{ty:"Carousel (8 slides)",ti:"4 Years at HAL \u2014 Visual Story",hk:"From drawing boards to aero engine test beds. 4 years that shaped everything.",cp:"[SLIDE 1] \u201C4 Years at HAL\u201D \u2014 The years that shaped everything.\n\n[SLIDE 2] Year 1: The Drawing Board. Folded drawings. Read blueprints. Foundation: laid.\n\n[SLIDE 3] Once trusted, I touched AutoCAD. I wasn\u2019t just drawing lines \u2014 I understood what they meant.\n\n[SLIDE 4] Beyond my lane: 60% reverse engineering, 20% incremental, 20% new product design.\n\n[SLIDE 5] Structural components. Vibrations. Acoustics. Hydraulics. I wanted to touch every part.\n\n[SLIDE 6] Year 4: Monitoring an entire test bed at an Air Force base. Alone.\n\n[SLIDE 7] \u201C100% safety. Zero room for error.\u201D This shaped every decision since.\n\n[SLIDE 8] What was the job that shaped your professional DNA?",ds:{format:"Carousel \u2014 8 slides. Swipeable memoir.",visual:"Cinematic editorial. Solid color bg + text. NO stock images.",palette:"Slide 1: Navy (#0F172A) + gold. Slides 2-7: Alternate off-white/charcoal. Slide 8: Gold + white.",font:"Headlines: Playfair 28-36px. Body: DM Sans 16px. Year labels: mono, 12px, gold.",cta:"Final slide: question + AK signature"},ht:"#HAL #AeroEngineering #CareerStory"},wa:[{d:"Mon",c:"\u201C100% safety. Zero room for error.\u201D \u2014 The principle that runs my life.",s:"Navy bg. White text."},{d:"Tue",c:"My HAL story in 8 slides on LinkedIn.",s:"Carousel cover preview."},{d:"Wed",c:"Work photo. \u201CStill the same curiosity. Just bigger machines.\u201D",s:"Real photo. Small text."},{d:"Thu",c:"\u201CEvery machine is a system. Every system has a story.\u201D",s:"Soft gray bg. Serif text."},{d:"Fri",c:"\u201CConnected manufacturing + tech this week. Different worlds. Same problem.\u201D",s:"Green bg."},{d:"Sat",c:"Weekend photo.",s:"Authentic."}]},
{wk:9,m:3,ph:"Authority",pillar:"🎯 First Principles Thinker",li:{ty:"Story Post + Image",ti:"The Derby Car Story",hk:"In engineering college, I built two cars. Neither had an engine.",cp:"In engineering college, I built two cars. Neither had an engine.\n\nDerby cars \u2014 relying on gravity, design, precision. Roll them down a slope. Speed and braking tell you everything.\n\nNo motor to hide behind. Just physics and craft.\n\nEverything since has been derby-car thinking.\n\n\u2192 Strip the noise. What\u2019s actually driving this?\n\u2192 Can\u2019t compensate with power? Get the design right.\n\u2192 Efficiency isn\u2019t adding more. It\u2019s wasting less.\n\nI still design without an engine. Let the fundamentals do the work.\n\nWhat\u2019s your derby car?",ds:{format:"Text + minimalist line-art derby car graphic",visual:"Simple silhouette on clean background.",palette:"White bg, charcoal line art, gold accent.",font:"'Derby Car Thinking' in Playfair as caption.",cta:"Open question. High reshare potential."},ht:"#FirstPrinciples #Design #Resourcefulness"},wa:[{d:"Mon",c:"\u201CNo engine. Just design. That\u2019s how I learned to build.\u201D",s:"White bg. Bold dark text."},{d:"Tue",c:"New post about building cars without engines. Read it.",s:"Light bg. Teaser."},{d:"Wed",c:"Work photo. \u201CThree meetings, three introductions. Good day.\u201D",s:"Real photo. Small text."},{d:"Thu",c:"\u201CEfficiency isn\u2019t adding more. It\u2019s wasting less.\u201D",s:"Cream bg. Serif text."},{d:"Fri",c:"\u201CMet someone who reminded me why I do this.\u201D",s:"Warm bg. Personal."},{d:"Sat",c:"Nature/wildlife.",s:"AK\u2019s photography."}]},
{wk:10,m:3,ph:"Authority",pillar:"🤝 The Catalyst",li:{ty:"Contrarian Take",ti:"Stop Networking. Start Noticing.",hk:"Unpopular opinion: Networking events are mostly useless.",cp:"Unpopular opinion: Networking events are mostly useless.\n\nNot the people. The intention.\n\nMost people go to GET something. A lead. A card.\n\nIn 25 years, my best connections happened because I was paying attention.\n\n\u2192 Noticed a junior engineer asking questions seniors avoided. Introduced her.\n\u2192 Noticed a founder with a problem I\u2019d seen solved elsewhere. One phone call.\n\u2192 Noticed two people who should know each other. Sent a text.\n\nNetworking is transactional. Noticing is generous.\n\nStop collecting contacts. Start paying attention.\n\nOne right introduction > 500 business cards.\n\nHow did your best professional relationship start?",ds:{format:"Text post. No graphic \u2014 the hook drives engagement.",visual:"None. \u2018Unpopular opinion\u2019 performs extremely well as plain text.",palette:"N/A",font:"Short punchy lines. Arrow (\u2192) for examples.",cta:"Agree/disagree drives massive comments."},ht:"#Networking #Relationships #Leadership"},wa:[{d:"Mon",c:"\u201CStop collecting contacts. Start paying attention to people.\u201D",s:"Dark bg. White text."},{d:"Tue",c:"Posted something that might ruffle feathers on LinkedIn.",s:"Text teaser."},{d:"Wed",c:"Meeting photo. \u201CBest connections happen when you\u2019re not trying.\u201D",s:"Candid photo."},{d:"Thu",c:"\u201CNetworking is transactional. Noticing is generous.\u201D",s:"Purple bg (#EDE9FE). Dark text."},{d:"Fri",c:"\u201CTwo people I introduced 6 months ago now work together.\u201D",s:"Green bg."},{d:"Sat",c:"Personal moment.",s:"No text."}]},
{wk:11,m:3,ph:"Authority",pillar:"🤝 The Catalyst",li:{ty:"Flagship Post",ti:"The Catalyst Manifesto",hk:"I\u2019ve never built my own empire. And I never plan to.",cp:"I\u2019ve never built my own empire. And I never plan to.\n\n25 years: aero engine test beds. Derby cars without engines. Teams at TCS, Cognizant, Citec. Now Lenor Ventures.\n\nBut the work I\u2019m most proud of? None of that.\n\nIt\u2019s the introductions.\n\n\u201CYou two need to talk.\u201D\n\u201CI know someone perfect for this.\u201D\nCoffees where I just listened \u2014 then connected the dots.\n\nI\u2019m a catalyst. I accelerate what\u2019s already there. I see potential before it\u2019s obvious.\n\n\u2192 Trust is built before business begins.\n\u2192 One right introduction > a hundred cold pitches.\n\u2192 The best way to grow is to help someone else grow first.\n\nBuilding something meaningful? Let\u2019s have a conversation. Not a pitch.",ds:{format:"Text post \u2014 THE positioning post. No image.",visual:"None. Pure manifesto. Graphics would dilute it.",palette:"N/A",font:"Short lines. Dashes for drama. Arrows for principles.",cta:"Soft CTA. Pin to Featured."},ht:"#PersonalBrand #Catalyst #Leadership #Trust"},wa:[{d:"Mon",c:"\u201CI don\u2019t build empires. I accelerate the people who do.\u201D",s:"Black bg. Gold text."},{d:"Tue",c:"Wrote something very personal on LinkedIn today.",s:"Cream bg. Understated."},{d:"Wed",c:"Event photo. \u201CThese conversations are what I live for.\u201D",s:"Real photo."},{d:"Thu",c:"\u201CTrust is built before business begins.\u201D",s:"Dark bg. White serif text."},{d:"Fri",c:"\u201CMade 3 introductions this week. None asked for. All needed.\u201D",s:"Sage green."},{d:"Sat",c:"Weekend photo.",s:"Authentic."}]},
{wk:12,m:3,ph:"Authority",pillar:"🤝 The Catalyst",li:{ty:"Forward-Looking Post",ti:"What\u2019s Next \u2014 Open Door",hk:"12 weeks ago, I started sharing what I\u2019ve learned. Here\u2019s what happened.",cp:"12 weeks ago, I started sharing more. Here\u2019s what happened.\n\nI didn\u2019t go viral. (Thank God.)\n\n\u2192 14 introductions. 6 led to real partnerships.\n\u2192 3 people said a post changed how they think.\n\u2192 1 person said a connection changed their career.\n\u2192 Dozens of conversations that wouldn\u2019t have happened.\n\nAll from showing up consistently.\n\nWhat\u2019s next: doubling down on connecting people.\n\nIf you\u2019re:\n\u2192 A founder looking for the right talent\n\u2192 A professional ready for a new challenge\n\u2192 Someone with a problem you can\u2019t see around\n\nDM me. No pitch. Just coffee.\n\nThe best things start with: \u201CYou should talk to Ananth.\u201D",ds:{format:"Text post with results. Optional: minimal scorecard graphic.",visual:"Clean scorecard showing the numbers.",palette:"White bg, dark text, gold accent on numbers.",font:"Numbers: Large serif gold. Labels: Small sans muted.",cta:"Ultimate CTA. DM-driving. Pin-worthy."},ht:"#PersonalBrand #Catalyst #Growth"},wa:[{d:"Mon",c:"\u201CThe best things start with: You should talk to Ananth.\u201D",s:"Gold bg (#B8860B). White text."},{d:"Tue",c:"12 weeks of sharing and connecting. Reflection on LinkedIn.",s:"Cream bg."},{d:"Wed",c:"\u201CThis is just the beginning.\u201D",s:"Black bg. White text."},{d:"Thu",c:"Photo from the week. \u201CNew conversations. New possibilities.\u201D",s:"Real photo. Small caption."},{d:"Fri",c:"\u201CThank you for being here. Here\u2019s to the next 12 weeks.\u201D",s:"Warm bg. Heartfelt."},{d:"Sat",c:"Celebration photo. \u201CGood week. Good people.\u201D",s:"Genuine smile."}]}
