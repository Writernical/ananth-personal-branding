      copy:`Everyone talks about innovation. Almost nobody talks about maintenance.

In my 4 years at HAL working on aero engine test beds, I learned something counterintuitive:

The most innovative thing you can do is maintain what already works.

We had systems where 100% safety wasn't a target — it was the minimum. One failure wasn't a "learning opportunity." It was unacceptable.

That taught me: real innovation isn't about the new thing. It's about understanding the existing thing so deeply that you know exactly where to improve it.

Three types of design:
→ Reverse engineering (understanding what exists)
→ Incremental design (improving what exists)
→ New product design (creating what doesn't exist)

Most people want to skip to #3. The best engineers — and the best leaders — master #1 first.

What do you think? Is the obsession with "disruption" causing us to neglect the power of deep understanding?`,

function Badge({children,color}) {
  const bg = color==="li"?C.liSoft:color==="wa"?C.waSoft:color==="red"?C.redSoft:color==="purple"?C.purpleSoft:C.goldSoft;
  const fg = color==="li"?C.li:color==="wa"?C.wa:color==="red"?C.red:color==="purple"?C.purple:C.gold;
  return <span style={{display:"inline-block",padding:"4px 11px",borderRadius:20,fontSize:11,fontWeight:600,background:bg,color:fg}}>{children}</span>;
}
function Card({children,style}) {
  return <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"18px 22px",boxShadow:"0 1px 3px rgba(0,0,0,0.03)",...style}}>{children}</div>;
}

                <div key={i} style={{display:"flex",gap:18,alignItems:"flex-start",padding:"14px 0"}}>
                  <div style={{width:36,height:36,borderRadius:"50%",background:i===0?C.gold:C.card,color:i===0?"#fff":C.gold,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:12,flexShrink:0,zIndex:1,border:`2px solid ${C.gold}`}}>{s.n}</div>
                  <div style={{paddingTop:3}}>
                    <p style={{color:C.text,fontSize:15,fontWeight:700,margin:"0 0 2px"}}>{s.l}</p>
                    <p style={{color:C.muted,fontSize:13,margin:0,lineHeight:1.5}}>{s.d}</p>
                  </div>
                </div>
              ))}
            </div>
          </Card>
          <div style={{background:C.goldSoft,borderRadius:14,padding:28,border:`1px solid ${C.goldBorder}`,textAlign:"center"}}>
            <p style={{color:C.gold,fontSize:11,textTransform:"uppercase",letterSpacing:"0.15em",fontWeight:700,margin:"0 0 4px"}}>Time from AK</p>
            <p style={{color:C.text,fontSize:40,fontWeight:900,margin:"0 0 4px",fontFamily:"'Playfair Display',serif"}}>~2 hrs/month</p>
            <p style={{color:C.muted,fontSize:13,margin:0}}>One recording session every two weeks. We do the rest.</p>
          </div>
        </div>}

        {/* 12-WEEK CONTENT CALENDAR */}
        {sec==="calendar"&&<div style={{animation:"fadeIn 0.5s"}}>
          <p style={{color:C.muted,fontSize:13,marginBottom:18,lineHeight:1.7}}>Complete 12-week execution plan. Each week includes full LinkedIn copy, WhatsApp status scripts, and design briefs. Click any week to expand.</p>

          {/* Month headers + week selectors */}
          <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
            {[{l:"Month 1: Foundation",w:[0,1,2,3]},{l:"Month 2: Momentum",w:[4,5,6,7]},{l:"Month 3: Authority",w:[8,9,10,11]}].map((m,mi)=>(
              <div key={mi} style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{fontSize:10,fontWeight:700,color:C.dim,textTransform:"uppercase",letterSpacing:"0.08em",marginRight:4}}>{m.l}:</span>
                {m.w.map(wi=>(
                  <button key={wi} onClick={()=>setWk(wi)} style={{
                    width:32,height:32,borderRadius:8,border:`1.5px solid ${wk===wi?C.accent:C.border}`,
                    background:wk===wi?C.accent:"transparent",color:wk===wi?"#fff":C.muted,
                    cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"'DM Sans',sans-serif",transition:"all 0.2s"
                  }}>{wi+1}</button>
                ))}
                {mi<2&&<div style={{width:1,height:20,background:C.border,margin:"0 6px"}}/>}
              </div>
            ))}
          </div>

          {/* Selected week detail */}
          <div style={{marginTop:16}}>
            <WeekDetail w={weeks[wk]}/>
          </div>
        </div>}

        {/* WEEKLY RHYTHM */}
        {sec==="rhythm"&&<div style={{animation:"fadeIn 0.5s"}}>
          <p style={{color:C.muted,fontSize:13,marginBottom:18,lineHeight:1.7}}>Repeatable weekly cadence. Consistent, not exhausting.</p>
          <Card style={{padding:0,overflow:"hidden",borderRadius:14}}>
            <div style={{display:"grid",gridTemplateColumns:"56px 1fr 1fr",background:C.bg,borderBottom:`1px solid ${C.border}`}}>
              <div style={{padding:10,textAlign:"center",fontSize:10,fontWeight:700,color:C.dim,letterSpacing:"0.1em"}}>DAY</div>
              <div style={{padding:"10px 12px",fontSize:10,fontWeight:700,color:C.li,letterSpacing:"0.1em",borderLeft:`1px solid ${C.border}`}}>LINKEDIN</div>
              <div style={{padding:"10px 12px",fontSize:10,fontWeight:700,color:C.wa,letterSpacing:"0.1em",borderLeft:`1px solid ${C.border}`}}>WHATSAPP STATUS</div>
            </div>
            {[
              {day:"MON",li:"Engage — comment on 5 posts",wa:"Text insight status"},
              {day:"TUE",li:"Publish — main post of the week",wa:"Work photo status"},
              {day:"WED",li:"Engage — reply to all comments",wa:"Quote or reflection"},
              {day:"THU",li:"—",wa:"Throwback photo or story"},
              {day:"FRI",li:"Engage + connect new profiles",wa:"Shoutout or intro status"},
              {day:"SAT",li:"—",wa:"Personal/life photo"},
              {day:"SUN",li:"Record next week's coffee prompt",wa:"—"},
            ].map((r,i)=>(
              <div key={i} style={{display:"grid",gridTemplateColumns:"56px 1fr 1fr",borderBottom:i<6?`1px solid ${C.border}`:"none",background:r.day==="SAT"||r.day==="SUN"?C.bg:"transparent"}}>
                <div style={{padding:"11px 8px",textAlign:"center",fontWeight:800,fontSize:11,color:r.day==="SAT"||r.day==="SUN"?C.dim:C.text}}>{r.day}</div>
                <div style={{padding:"11px 12px",fontSize:12,color:r.li==="—"?C.dim:C.text,borderLeft:`1px solid ${C.border}`}}>{r.li}</div>
                <div style={{padding:"11px 12px",fontSize:12,color:r.wa==="—"?C.dim:C.text,borderLeft:`1px solid ${C.border}`}}>{r.wa}</div>
              </div>
            ))}
          </Card>
          <div style={{marginTop:22,display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:10}}>
            {[{l:"LinkedIn Posts",v:"8-10/mo",s:"2-3 per week"},{l:"WhatsApp Statuses",v:"25-30/mo",s:"1 per day"},{l:"Introductions",v:"8-10/mo",s:"2 per week"},{l:"AK's Time",v:"~2 hrs/mo",s:"Recording sessions"}].map((x,i)=>(
              <Card key={i} style={{textAlign:"center",padding:18}}>
                <p style={{color:C.text,fontSize:28,fontWeight:900,margin:0,fontFamily:"'Playfair Display',serif"}}>{x.v}</p>
                <p style={{color:C.text,fontSize:11,fontWeight:600,margin:"4px 0 1px"}}>{x.l}</p>
                <p style={{color:C.dim,fontSize:10,margin:0}}>{x.s}</p>
              </Card>
            ))}
          </div>
        </div>}

        <div style={{textAlign:"center",marginTop:48,paddingTop:18,borderTop:`1px solid ${C.border}`}}>
          <p style={{color:C.dim,fontSize:11}}>The Catalyst's Playbook — Structure meets Authenticity</p>
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
