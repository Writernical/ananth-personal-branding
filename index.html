    <p style="color:#6B6560;font-size:14px;max-width:520px;margin:0 auto;line-height:1.75">A 90-day execution plan for Ananth Karthik S. Professionally humorous. Strategically authentic. Built on the scriptless model.</p>

var WKS=[
{wk:1,m:1,ph:"Foundation",pillar:"\uD83E\uDD1D The Catalyst",li:{ty:"Text Post (Sarcastic Intro)",ti:"Who is Ananth Karthik?",hk:"Who is Ananth Karthik? Great question. I\u2019ve been Googling myself for 25 years and I still don\u2019t have a clear answer.",cp:"Who is Ananth Karthik?\n\nGreat question. I\u2019ve been Googling myself for 25 years and I still don\u2019t have a clear answer.\n\nSo let me tell you what I\u2019m NOT:\n\nI\u2019m NOT a LinkedIn influencer. If I ever post a selfie with an airport lounge captioned \u201Cgrateful for the journey,\u201D please report my account.\n\nI\u2019m NOT a motivational speaker. The most motivating thing I\u2019ve ever done was convincing my boss at Hindustan Aeronautics Limited that making me fold drawings for a month was \u201Ca great learning experience\u201D and not a hazing ritual.\n\nI\u2019m NOT a startup bro. I\u2019ve never \u201Cdisrupted\u201D anything. Well, except a CNC machine at my cousin\u2019s factory when I was 14. He still brings it up at family dinners.\n\nI\u2019m NOT an AI thought leader. But I did build an AI fact-checker that\u2019s being used by the Karnataka CID. So at least the police trust my code, even if LinkedIn doesn\u2019t trust my opinions yet.\n\nOkay, so what AM I?\n\nI\u2019m the guy who spent 4 years designing aero engine test beds where one mistake could be genuinely fatal \u2014 and the scariest part was still my first month folding paper.\n\nI\u2019m the guy who built derby cars without engines in college. (Yes, that\u2019s a real thing. No, I will not stop bragging about it.)\n\nI\u2019m the guy who\u2019s spent 9+ years building forensic light sources, AI voice bots, an AI fact-checker used by the Karnataka CID, and ERP systems for 250+ companies.\n\nI\u2019m the guy who recently started assembling weird, brilliant, obsessive niche teams that solve problems nobody else will touch. We\u2019re building AI sentiment analysis tools, sports performance wearables for football athletes, and clinic management systems that boosted a hospital\u2019s revenue by 42%.\n\nBut honestly? The thing I\u2019m best at has nothing to do with technology.\n\nI\u2019m best at calling you at 10 PM and saying: \u201CYou need to meet this person. Trust me.\u201D\n\nI\u2019ve done it quietly for 25 years. Apparently I\u2019m now supposed to do it loudly on the internet. So here I am.\n\nNo script. No ghostwriter. No strategy deck. Just a mechanical engineer who accidentally became a people engineer.\n\nIf you\u2019re here for polished corporate content, I have bad news.\n\nIf you\u2019re here for real stories, strong chai-fuelled opinions, and the occasional introduction that might actually change your career \u2014 pull up a chair.\n\nFirst order of business: What would YOUR honest, sarcastic LinkedIn bio say?\n\nDrop it in the comments. Let\u2019s see who\u2019s actually funny here.\n\n(I\u2019ll go first in the comments. Fair warning: it\u2019s not flattering.)",ds:{format:"Text-only post. The humor IS the design. Zero graphics.",visual:"No image needed. This is a pattern interrupt. Everyone else is posting carousels about \u201C5 leadership lessons.\u201D AK is posting comedy.",palette:"N/A \u2014 native LinkedIn text. The personality does the design work.",font:"Short punchy lines. ALL CAPS for the NOT/AM structure. Read it like standup comedy \u2014 setup, setup, punchline.",cta:"Ask for THEIR sarcastic bio. Guaranteed comment magnet. Everyone wants to be the funniest in the thread."},ht:"#WhoAmI #PersonalBranding #RealTalk #Engineering #Humor"},wa:[{d:"Mon",c:"\u201CApparently I need a personal brand. Step 1: Figure out who I am. Step 2: Panic.\u201D",s:"Black bg. White text. Deadpan delivery."},{d:"Tue",c:"Selfie looking confused at phone. \u201CJust posted my first real LinkedIn post. My wife read it and said \u2018interesting.\u2019 In 25 years of marriage, I\u2019ve learned that\u2019s never good.\u201D",s:"Real photo. Unpolished. Funny caption."},{d:"Wed",c:"\u201CMy old LinkedIn headline was: Inventor | Nemophilist | Wildlife Photographer | Mentor. That\u2019s not a bio. That\u2019s a personality disorder.\u201D",s:"Cream bg. Dark text. Self-roast about old headline."},{d:"Thu",c:"\u201C25 years of connecting people quietly. LinkedIn says I need to \u2018post consistently.\u2019 God help everyone.\u201D",s:"White bg. Bold text. Dry."},{d:"Fri",c:"\u201CBest introduction I ever made: Introduced myself to the idea that being invisible isn\u2019t a strategy. Jury\u2019s still out.\u201D",s:"Gold bg (#FEF3C7). Self-aware."},{d:"Sat",c:"Wildlife photo. Caption: \u201CAt least the animals never ask me about my personal brand.\u201D",s:"Full photo + funny caption."}],tv:{goal:"Launch with maximum engagement \u2014 humor makes people WANT to share.",actions:[{who:"5-8 friends who get AK\u2019s humor",what:"Drop their own sarcastic LinkedIn bios in comments",how:"DM: \u201CI\u2019m posting the most un-LinkedIn thing ever. Would love it if you dropped your own sarcastic bio in the comments. Let\u2019s make this the funniest thread on LinkedIn today.\u201D",why:"Multiple people playing along turns it into a viral thread."},{who:"3 people AK has introduced",what:"Comment confirming the \u201C10 PM phone call\u201D claim with a real story",how:"\u201CThe post is funny but the intro part is real. If I\u2019ve connected you with someone who mattered, drop a line?\u201D",why:"Humor gets attention. Social proof in comments keeps it."},{who:"AK himself",what:"Reply to EVERY comment with wit",how:"First comment should be AK\u2019s own sarcastic bio. Then riff on everyone\u2019s jokes. Warm, generous, funny.",why:"AK\u2019s comment behavior IS the brand. Set the tone for 12 weeks."}]}},
{wk:2,m:1,ph:"Foundation",pillar:"\uD83D\uDD27 The Engineer's Mind",li:{ty:"Carousel (6 slides)",ti:"The Boy Who Broke a CNC Machine",hk:"When I was 14, I broke my cousin\u2019s CNC machine. He still hasn\u2019t forgiven me. But that summer changed my life.",cp:"[SLIDE 1] \u201CThe Boy Who Broke a CNC Machine\u201D\nAnd other expensive mistakes that shaped my career\n\n[SLIDE 2] Every summer vacation: two months in Bangalore. Other kids went to summer camp. I went to my cousin\u2019s CNC factory. Voluntarily. (My parents were thrilled. My cousin was suspicious.)\n\n[SLIDE 3] I didn\u2019t understand 80% of what I saw. But I touched everything. Asked questions that made grown engineers uncomfortable. And yes, I broke a machine. Once. The look on my cousin\u2019s face could have melted steel.\n\n[SLIDE 4] But that factory gave me something no school could: the world is a machine. Every problem has parts. Understand the parts, you can fix anything. (Except my cousin\u2019s trust. That\u2019s still broken.)\n\n[SLIDE 5] 25 years later, I still approach every challenge the same way \u2014 dismantle it, stare at the pieces until they confess, then rebuild. Whether it\u2019s an aero engine test bed or a business strategy.\n\n[SLIDE 6] What\u2019s your \u201CI accidentally broke something expensive and it turned into a life lesson\u201D story? I know you have one.",ds:{format:"Carousel \u2014 6 slides. Funny + nostalgic.",visual:"Editorial feel. Solid bg + text. No stock images. Think memoir with a sense of humor.",palette:"Slide 1: Deep navy + gold. Slides 2-5: Alternate warm cream and soft charcoal. Slide 6: Gold + white.",font:"Headlines: Playfair 28px. Body: DM Sans 16px. Keep it warm.",cta:"Ask for THEIR expensive mistake story. Universally relatable."},ht:"#Engineering #Curiosity #SystemsThinking #ChildhoodLessons"},wa:[{d:"Mon",c:"\u201CThe world is a machine. I figured this out by breaking one at age 14.\u201D",s:"Navy bg. Gold text."},{d:"Tue",c:"New carousel on LinkedIn about the summer I destroyed my cousin\u2019s factory equipment. And learned everything.",s:"Carousel cover."},{d:"Wed",c:"Work photo. \u201CSome problems need a whiteboard. Most just need two people who aren\u2019t afraid to say \u2018I have no idea.\u2019\u201D",s:"Real photo. White text."},{d:"Thu",c:"\u201CI used to take apart toys to understand them. My parents called it \u2018destructive.\u2019 I call it \u2018reverse engineering.\u2019 Same thing, different PR.\u201D",s:"Beige bg. Playful serif text."},{d:"Fri",c:"Shoutout: \u201C[Name] is one of the sharpest people I know. And no, they didn\u2019t pay me to say that. (Though I\u2019m open to offers.)\u201D",s:"Green bg. Warm + witty."},{d:"Sat",c:"Wildlife photo. \u201CWeekend hobby: photographing animals that don\u2019t need ERP systems.\u201D",s:"Photo + dry caption."}],tv:{goal:"Cousin/family validates the CNC story. Nostalgia engagement.",actions:[{who:"The cousin who owned the factory",what:"Comment with their memory of young AK breaking things",how:"\u201CWrote about your factory. And the machine. Please don\u2019t kill me. A comment would be amazing though.\u201D",why:"Family member confirming a funny childhood story = pure LinkedIn gold."},{who:"Engineering batchmates",what:"Share their own childhood curiosity stories in comments",how:"Tag 3-4 in the post: \u201CI know you have a story. Spill it.\u201D",why:"Peer engagement creates community."}]}},
{wk:3,m:1,ph:"Foundation",pillar:"\u2708\uFE0F 25 Years, Zero Shortcuts",li:{ty:"Text Post",ti:"My First Assignment: Fold Paper",hk:"My first assignment at Hindustan Aeronautics Limited \u2014 one of India\u2019s most prestigious engineering companies \u2014 was to fold paper. For a month. With a degree.",cp:"My first assignment at Hindustan Aeronautics Limited \u2014 one of India\u2019s most prestigious engineering companies \u2014 was to fold paper.\n\nFor a month.\n\nWith a degree.\n\nWeek 1: They taught me paper sizes. A0, A1, A2. Riveting stuff. I kept waiting for someone to say \u201Cgotcha!\u201D Nobody did.\n\nWeek 2: Filing systems. I became the world\u2019s most overqualified filing clerk. My mother was very proud. (She was not.)\n\nWeek 3: Reading other people\u2019s drawings. I understood about 30% of them. I nodded like I understood 100%.\n\nWeek 4: I finally cracked. I started asking every designer every question I could think of. They either loved my curiosity or wanted me to go away. Either way, I learned.\n\nAnd then something clicked.\n\nBy the time they let me touch AutoCAD, I wasn\u2019t just drawing lines on a screen. I understood what every line meant. Where it came from. Why it mattered.\n\nThat month of \u201Cuseless\u201D paper-folding taught me something no engineering course ever did:\n\n\u2192 Before you create, understand what already exists.\n\u2192 Before you lead, learn to follow without complaining. (I complained. But quietly.)\n\u2192 Foundations aren\u2019t glamorous. They\u2019re just necessary.\n\n25 years later, I still \u201Cfold paper\u201D before I start any project. I just call it \u201Cresearch\u201D now because that sounds more impressive on LinkedIn.\n\nWhat was YOUR most humbling first assignment? The one that felt pointless but turned out to be everything?",ds:{format:"Text-only post. The story + humor carry it.",visual:"No graphic. Strong hooks and comedic pacing outperform any image.",palette:"N/A",font:"Short lines. Parenthetical asides for humor. Arrows for takeaways.",cta:"Question about THEIR humbling first job. Universally relatable."},ht:"#FirstJob #HAL #Engineering #Patience #CareerLessons"},wa:[{d:"Mon",c:"\u201CLearn to fold before you build.\u201D \u2014 My very expensive first lesson at HAL.",s:"Black bg. White text."},{d:"Tue",c:"Workspace photo. \u201CStill folding. Still learning. The paper is just more metaphorical now.\u201D",s:"Real photo. Warm."},{d:"Wed",c:"\u201CThe best careers are built on foundations nobody wants to Instagram.\u201D",s:"Cream bg. Serif text."},{d:"Thu",c:"Throwback photo. \u201C2001. The drawing board era. Before AutoCAD and before my hairline retreated.\u201D",s:"Old photo. Self-deprecating caption."},{d:"Fri",c:"\u201CConnected two people this week who had the same problem. They didn\u2019t know each other. Now they do. My work here is done. (It\u2019s never done.)\u201D",s:"Blue bg."},{d:"Sat",c:"Nature shot. \u201CWeekend mode: No ERPs. No standups. Just birds who don\u2019t need quarterly reviews.\u201D",s:"Photo + caption."}],tv:{goal:"HAL mentor/colleague confirms the paper-folding story.",actions:[{who:"Senior designer from HAL",what:"Comment with their version",how:"\u201CWrote about our first month together. Please confirm I wasn\u2019t hallucinating. A comment would mean a lot.\u201D",why:"Mentor validation makes the story 10x more powerful."},{who:"HAL colleagues in WhatsApp group",what:"Engage + comment",how:"Share link in group: \u201CRemember the folding days? Just wrote about it.\u201D",why:"Colleague cluster engagement."}]}},
{wk:4,m:1,ph:"Foundation",pillar:"\uD83E\uDD1D The Catalyst",li:{ty:"People Spotlight",ti:"The 10 PM Phone Call",hk:"I have a habit that my wife finds deeply annoying. I make phone calls at 10 PM. Not to chat. To say: \u201CYou need to meet this person.\u201D",cp:"I have a habit that my wife finds deeply annoying.\n\nI make phone calls at 10 PM.\n\nNot to gossip. Not to complain about the day. To say one thing:\n\n\u201CYou need to meet this person. Trust me.\u201D\n\nThree years ago, I got one of those calls \u2014 from myself, to myself. (Okay, it was more of a thought.)\n\nSomeone told me about a young engineer. Great skills. Zero connections. No one would take a chance on him because he didn\u2019t have the \u201Cright\u201D background.\n\nI picked up the phone. Made one introduction.\n\nThat engineer now leads a team of 15. He\u2019s building things I couldn\u2019t dream of.\n\nI didn\u2019t mentor him. I didn\u2019t coach him. I didn\u2019t give him a motivational speech. (Have you met me? I can barely motivate myself to exercise.)\n\nI just saw someone with potential and connected them to someone with an opportunity.\n\nThat\u2019s it. That\u2019s the whole skill.\n\n25 years. Two companies. 250+ client projects. But the thing I\u2019m actually good at? Picking up the phone at inconvenient hours.\n\nMy wife says it\u2019s a problem. I say it\u2019s a business model.\n\nTag someone who made YOU that one introduction. The person who saw something in you before your resume did.",ds:{format:"Text post. Storytelling with humor.",visual:"No image. The warmth and wit carry it.",palette:"N/A",font:"Short paragraphs. Parenthetical jokes. Emotional landing.",cta:"Tag prompt drives massive reach."},ht:"#PeopleFirst #Catalyst #Networking #Connections"},wa:[{d:"Mon",c:"\u201CIt\u2019s not about what you build. It\u2019s about who you put in the room. Preferably before midnight.\u201D",s:"Slate bg. White text."},{d:"Tue",c:"LinkedIn post today about my 10 PM phone habit. My wife is thrilled I\u2019m publicizing this.",s:"Cream bg. Teaser."},{d:"Wed",c:"Photo at event. \u201CGood conversations > good presentations. Also: good coffee > both.\u201D",s:"Real photo."},{d:"Thu",c:"\u201CThe best networking advice I ever got: Stop networking. Start paying attention. Then call people at unreasonable hours.\u201D",s:"Terracotta bg."},{d:"Fri",c:"\u201CLooking for a sharp [role] for a friend\u2019s company. DM me. I promise I won\u2019t call you at 10 PM. (Probably.)\u201D",s:"White bg. Actionable + funny."},{d:"Sat",c:"Wildlife photo. \u201CThe only beings who don\u2019t get my 10 PM calls. Lucky them.\u201D",s:"Photo + caption."}],tv:{goal:"The featured engineer tells THEIR side.",actions:[{who:"The engineer from the story",what:"Post their perspective or reshare",how:"\u201CWriting about our story. Your side would be incredible. Totally your call.\u201D",why:"Two perspectives on one story = undeniable social proof."},{who:"3-5 others AK has connected",what:"Comment with \u201CAK introduced me to...\u201D stories",how:"\u201CIf I\u2019ve ever made a connection that mattered to you, a comment would mean a lot.\u201D",why:"Pattern recognition in comments."}]}},
{wk:5,m:2,ph:"Momentum",pillar:"\uD83C\uDFAF First Principles Thinker",li:{ty:"Framework Post",ti:"How I Solve Problems (Stolen From a Test Bed)",hk:"I can\u2019t solve a problem unless I see the whole machine. My colleagues find this either impressive or incredibly slow. Depends on the deadline.",cp:"I can\u2019t solve a problem unless I see the whole machine.\n\nMy colleagues find this either impressive or incredibly slow. Depends on the deadline.\n\nHere\u2019s how I think \u2014 and I stole this framework from 4 years of designing aero engine test beds at HAL, where getting it wrong wasn\u2019t a \u201Clearning opportunity.\u201D It was a catastrophe.\n\n1\uFE0F\u20E3 MAP THE MACHINE\nWhat are ALL the moving parts? Not just the obvious ones. The hidden dependencies. The things nobody wants to talk about in meetings.\n\n2\uFE0F\u20E3 FIND THE FRICTION\nWhere is energy being wasted? What\u2019s grinding against what? (In test beds, this was literal. In business, it\u2019s usually two departments that don\u2019t talk to each other.)\n\n3\uFE0F\u20E3 TRACE THE CONNECTIONS\nIf I change Part A, what happens to Part B, C, and D? In a test bed, you learn this fast. In a company, people learn it when something breaks.\n\n4\uFE0F\u20E3 REBUILD FROM FIRST PRINCIPLES\nDon\u2019t patch. Redesign. But only after you\u2019ve done steps 1-3. Otherwise you\u2019re just rearranging deck chairs with a fancier framework.\n\nI\u2019ve used this to build AI fact-checkers, assemble niche engineering teams for sports wearable projects, and debug 250+ ERP implementations across industries.\n\nAlso to figure out why my home WiFi keeps dropping. (Step 2 revealed the router was behind a metal bookshelf. I have an engineering degree.)\n\nWhat\u2019s YOUR go-to framework? Or do you just wing it? (No judgement. I wing my cooking.)",ds:{format:"Text + optional 4-step infographic",visual:"Clean infographic if created. Or pure text \u2014 the humor makes it memorable.",palette:"White bg, gold step numbers, dark text.",font:"Numbered emojis for steps. Parenthetical asides for humor.",cta:"Question inviting frameworks OR confessions of winging it."},ht:"#SystemsThinking #ProblemSolving #Framework #Engineering"},wa:[{d:"Mon",c:"\u201CDon\u2019t fix the symptom. Understand the machine. Then fix it. Then take credit.\u201D",s:"Charcoal bg. White text."},{d:"Tue",c:"Shared my problem-solving framework on LinkedIn. It\u2019s from designing things that explode if you get them wrong.",s:"Graphic preview."},{d:"Wed",c:"Whiteboard photo. \u201CThis is what thinking looks like. Messy, caffeinated, and covered in marker stains.\u201D",s:"Candid photo."},{d:"Thu",c:"\u201CThe best leaders I know don\u2019t have all the answers. They have better questions. And usually, better coffee.\u201D",s:"Navy bg. Serif."},{d:"Fri",c:"\u201CIntroduced two people today who\u2019d been trying to solve the same problem separately. They didn\u2019t know each other existed. I love my job.\u201D",s:"Green bg."},{d:"Sat",c:"Nature photo. \u201CNature: the original systems thinker. Also doesn\u2019t use Jira.\u201D",s:"Photo + wit."}],tv:{goal:"A peer applies AK\u2019s framework publicly.",actions:[{who:"A founder who\u2019s seen AK work",what:"Comment with a real example",how:"\u201CYou\u2019ve seen me do this live. Would you share that moment in the comments?\u201D",why:"Third-party framework validation."},{who:"2 founders",what:"Reshare the graphic",how:"Send before publishing. \u201CFeel free to use this with your audience.\u201D",why:"Framework spreads through others\u2019 feeds."}]}},
{wk:6,m:2,ph:"Momentum",pillar:"\uD83D\uDD27 The Engineer's Mind",li:{ty:"Opinion Post",ti:"Disruption is Overrated. Maintenance is Underrated.",hk:"Hot take: The most innovative thing you can do in 2026 is maintain something that already works. I know. Very un-LinkedIn of me.",cp:"Hot take: The most innovative thing you can do in 2026 is maintain something that already works.\n\nI know. Very un-LinkedIn of me.\n\nEveryone here is disrupting something. Disrupting healthcare. Disrupting education. Disrupting the way we order coffee. (It\u2019s coffee. It doesn\u2019t need disrupting.)\n\nMeanwhile, at HAL, we had systems where 100% safety wasn\u2019t the target. It was the MINIMUM. One failure wasn\u2019t a \u201Clearning opportunity.\u201D It was unacceptable.\n\nThat taught me something the startup world doesn\u2019t like to hear:\n\nBefore you build the new thing, understand the existing thing so deeply that you know EXACTLY what needs changing.\n\nThree types of design:\n\u2192 Reverse engineering \u2014 Understand what exists (boring but essential)\n\u2192 Incremental design \u2014 Improve what exists (less boring, very underrated)\n\u2192 New product design \u2014 Create what doesn\u2019t exist (sexy, sells well on LinkedIn)\n\nEveryone wants to skip to #3. Post about it. Get the likes.\n\nThe best engineers? They\u2019re still on #1. And they\u2019re the reason your plane doesn\u2019t fall out of the sky.\n\nI\u2019ve been part of 250+ ERP implementations across industries. You know what made them work? Not innovation. Understanding the client\u2019s existing mess before trying to fix it.\n\nIs the obsession with \u201Cdisruption\u201D making us worse at understanding?\n\nDisagree violently? Good. Tell me in the comments. I\u2019ll bring the popcorn.",ds:{format:"Text post. Controversial hook format.",visual:"None. The \u201Chot take\u201D format performs best as text.",palette:"N/A",font:"Short punchy lines. Arrows. Sarcastic asides.",cta:"Invite disagreement. Controversy = comments."},ht:"#Innovation #Engineering #HotTake #Disruption"},wa:[{d:"Mon",c:"\u201CThe most innovative thing you can do? Maintain something that works. I know. I\u2019m fun at parties.\u201D",s:"Cream bg. Dry humor."},{d:"Tue",c:"Just told LinkedIn that disruption is overrated. My DMs are going to be interesting.",s:"Gray bg. Teaser."},{d:"Wed",c:"Work photo. \u201C3-hour whiteboard session. No slides. No agenda. The best meeting I\u2019ve had in months.\u201D",s:"Real photo."},{d:"Thu",c:"\u201CReverse engineer \u2192 Improve \u2192 Create. In that order. Not the other way around. I will die on this hill.\u201D",s:"Bold text. White bg."},{d:"Fri",c:"\u201C[Name] is doing phenomenal work in [space]. And no, this isn\u2019t a paid promotion. I\u2019m just a fan.\u201D",s:"Green bg."},{d:"Sat",c:"Personal photo. \u201CWeekend project: disrupting nothing. Just reading.\u201D",s:"Photo + anti-hustle humor."}],tv:{goal:"Spark a debate. Get leaders to agree or disagree publicly.",actions:[{who:"3-5 CTOs/engineering leaders",what:"Tag them asking for their take",how:"Comment: \u201C@[Name] you\u2019ve dealt with this. Innovation vs deep maintenance \u2014 where do you land?\u201D",why:"When leaders respond, the post becomes a conversation."},{who:"WhatsApp contacts",what:"Forward post with a personal nudge",how:"\u201CWrote something spicy. Curious if you agree.\u201D",why:"Private nudges = public comments."}]}},
{wk:7,m:2,ph:"Momentum",pillar:"\uD83E\uDD1D The Catalyst",li:{ty:"People Spotlight #2",ti:"She Had the Skills. She Didn\u2019t Have the Room.",hk:"Two years ago, I met a product manager at an event. She was the smartest person in the room. The problem was: nobody in the room knew it.",cp:"Two years ago, I met a product manager at an event.\n\nShe was the smartest person in the room.\n\nThe problem was: nobody in the room knew it.\n\nStuck in a role two levels below her capability. Not because she wasn\u2019t talented. Because she\u2019d never been in the right room with the right people.\n\nI didn\u2019t give her career advice. (I\u2019m barely qualified to give myself career advice.)\n\nI just asked one question: \u201CIf you could work anywhere, what would you build?\u201D\n\nHer answer was so specific, so passionate, so clearly thought-through, that my brain immediately did the thing it does \u2014 I thought of someone who needed EXACTLY that energy.\n\nOne WhatsApp introduction. That\u2019s it. Four sentences. \u201CHey [Name], meet [Name]. You\u2019re solving similar problems. Talk.\u201D\n\nShe\u2019s now leading product for a team that\u2019s tripled in size.\n\nI didn\u2019t do the work. She did ALL of it. I just opened a door she didn\u2019t know existed.\n\nHere\u2019s what I\u2019ve learned in 25 years of accidental matchmaking:\n\n\u2192 Talent is everywhere. Opportunity is concentrated in rooms most people aren\u2019t invited to.\n\u2192 The most powerful thing you can do is believe in someone before their LinkedIn profile does.\n\u2192 One right introduction will always outperform 100 motivational quotes. (Sorry, LinkedIn.)\n\nWho in YOUR network deserves a bigger room? Tag them. Or better yet \u2014 make the introduction yourself. It\u2019s free. It takes 4 sentences. And it might change everything.",ds:{format:"Text post. Emotional storytelling with light humor.",visual:"None. Pure narrative.",palette:"N/A",font:"Short paragraphs. Arrows. One-liner punchlines.",cta:"Tag AND call-to-action to make their own introduction."},ht:"#Talent #Opportunity #Catalyst #PeopleFirst"},wa:[{d:"Mon",c:"\u201CTalent is everywhere. The right rooms are not. Be the door.\u201D",s:"Teal bg. White text."},{d:"Tue",c:"Told a story on LinkedIn about 4 sentences that changed someone\u2019s career. My most personal post yet.",s:"Cream bg."},{d:"Wed",c:"Coffee meeting photo. \u201CThe best meetings have no agenda and end with \u2018you NEED to talk to this person.\u2019\u201D",s:"Warm photo."},{d:"Thu",c:"\u201CEvery introduction I make passes one test: Will this conversation make BOTH people better? If not, I keep my mouth shut. (Rare for me.)\u201D",s:"Amber bg."},{d:"Fri",c:"\u201CLooking for a sharp [role]. DM me. I collect talented people the way normal people collect shoes.\u201D",s:"White bg. Actionable + funny."},{d:"Sat",c:"Weekend photo. \u201CWeekend activity: Not making introductions. (Okay, fine. I made one.)\u201D",s:"Self-aware."}],tv:{goal:"Featured person writes their own response post.",actions:[{who:"The PM from the story",what:"Post their perspective: \u201CThe introduction that changed my career\u201D",how:"Coordinate timing: AK Tuesday, she Thursday. \u201CJust tell your version. Tag me if comfortable.\u201D",why:"TWO posts, one story, two perspectives. Massive reach."},{who:"2 mutual connections",what:"Comment confirming the story",how:"\u201CYou were there. Would you add what you saw?\u201D",why:"Three voices. Impossible to fake."}]}},
{wk:8,m:2,ph:"Momentum",pillar:"\u2708\uFE0F 25 Years, Zero Shortcuts",li:{ty:"Carousel (8 slides)",ti:"4 Years at HAL: An Overqualified Paper-Folder\u2019s Journey",hk:"From folding drawings to monitoring test beds at an Air Force base. Alone. 4 years that turned a confused graduate into whatever I am now.",cp:"[SLIDE 1] \u201C4 Years at HAL\u201D\nFrom folding drawings to monitoring test beds at an Air Force base. Alone.\n\u2014 An overqualified paper-folder\u2019s journey\n\n[SLIDE 2] Year 1: The Drawing Board\nFolded paper. Read blueprints. Asked questions that made senior designers reconsider their career choices. Foundation: accidentally laid.\n\n[SLIDE 3] First time on AutoCAD\nI wasn\u2019t just drawing lines. I understood every line. What it meant. Where it came from. (The paper-folding actually worked. Don\u2019t tell my old boss I admitted this.)\n\n[SLIDE 4] Year 2-3: I went rogue (politely)\n60% reverse engineering. 20% incremental design. 20% new product design. Most teammates: 100% reverse engineering. Me: I couldn\u2019t resist understanding the whole machine.\n\n[SLIDE 5] The Scope Creep of Curiosity\nStructural components. Foundation work. Vibrations. Sound. Acoustics. Hydraulics. Integration. Testing. I wanted to touch EVERY part. My manager called it \u201Centhusiasm.\u201D His face said \u201Cexhaustion.\u201D\n\n[SLIDE 6] Year 4: The Air Force Base\nPut in charge of monitoring an entire test bed construction. In northern India. Alone. The culmination of 4 years of relentless, probably annoying, curiosity.\n\n[SLIDE 7] The Principle\n\u201C100% safety. Zero room for error.\u201D\nNot a motivational poster. A literal job requirement. This principle has run every decision I\u2019ve made for 25 years.\n\n[SLIDE 8] Your Turn\nWhat was the job that shaped your professional DNA?\nThe one that turned you from \u201Csomeone with a degree\u201D into whoever you are now?\n\u2014 AK",ds:{format:"Carousel \u2014 8 slides. Memoir meets comedy.",visual:"Cinematic editorial. Solid color backgrounds. NO stock images. Think autobiography with a sense of humor.",palette:"Slide 1: Navy + gold. Slides: Alternate cream and charcoal. Final: Gold + white.",font:"Playfair headlines. DM Sans body. Year labels in uppercase gold mono.",cta:"Final slide: personal question + AK signature."},ht:"#HAL #AeroEngineering #CareerStory #Engineering"},wa:[{d:"Mon",c:"\u201C100% safety. Zero room for error.\u201D \u2014 Not a poster on my wall. A principle in my spine.",s:"Navy bg. White."},{d:"Tue",c:"My HAL story in 8 slides. From paper-folding to Air Force bases. It\u2019s a journey.",s:"Carousel preview."},{d:"Wed",c:"Work photo. \u201CStill the same curiosity. Just bigger machines and fewer people I can annoy with questions.\u201D",s:"Real photo."},{d:"Thu",c:"\u201CEvery machine tells a story if you listen. Some machines also make terrifying sounds if you don\u2019t maintain them. Both are useful data.\u201D",s:"Gray bg. Serif."},{d:"Fri",c:"\u201CConnected someone in manufacturing with someone in AI this week. They were solving the same problem from different centuries. Beautiful.\u201D",s:"Green bg."},{d:"Sat",c:"Weekend photo.",s:"Authentic."}],tv:{goal:"HAL colleagues post their own memories.",actions:[{who:"2-3 former HAL teammates",what:"Share their own HAL stories, tagging AK",how:"Share in team WhatsApp: \u201CAnyone else want to share their version of the HAL days on LinkedIn this week?\u201D",why:"Multiple people, same organisation, same week = event."},{who:"Senior designer who trained AK",what:"Comment or recommendation",how:"Personal call: \u201CSir, I wrote about our time. Would you share a few words?\u201D",why:"Mentor endorsement = gold standard."}]}},
{wk:9,m:3,ph:"Authority",pillar:"\uD83C\uDFAF First Principles Thinker",li:{ty:"Story Post",ti:"The Cars With No Engine",hk:"In engineering college, I built two cars. Neither had an engine. Before you judge \u2014 that was the whole point.",cp:"In engineering college, I built two cars.\n\nNeither had an engine.\n\nBefore you judge \u2014 that was the whole point.\n\nThey were derby cars. Full-fledged vehicles that run on gravity, design, and the sheer stubbornness of engineering students who haven\u2019t slept in three days.\n\nYou roll them down a slope. Speed and braking tell you everything about how well you engineered. No motor to hide behind. No power to compensate for lazy design.\n\nJust physics. And prayer.\n\nWe competed. We lost. We rebuilt. We competed again. We lost less. (We never won. But we got really good at losing gracefully.)\n\nAnd here\u2019s the thing I didn\u2019t realize then:\n\nEverything I\u2019ve done since has been derby-car thinking.\n\nWhen I assemble niche teams for a new product \u2014 whether it\u2019s an AI sentiment tool or a sports wearable \u2014 strip the noise, find the 3 people who are the engine.\n\nAfter 250+ ERP implementations: you can\u2019t add more features to fix a bad foundation. Get the design right first.\n\nIn introductions: don\u2019t throw 50 names at someone. One right person > an entire networking event.\n\n\u2192 If you can\u2019t compensate with power, you better get the design right.\n\u2192 Efficiency isn\u2019t about adding more. It\u2019s about wasting less.\n\u2192 Sometimes the best engine is no engine at all.\n\nWhat\u2019s YOUR derby car? The project that taught you more than your degree?",ds:{format:"Text + optional line-art graphic.",visual:"Minimalist derby car illustration if available.",palette:"White bg, charcoal art, gold accent.",font:"Playfair caption. Setup-punchline rhythm.",cta:"Open question. High reshare potential."},ht:"#FirstPrinciples #Design #Engineering #LessIsMore"},wa:[{d:"Mon",c:"\u201CNo engine. Just design. That\u2019s still how I build everything.\u201D",s:"White bg. Bold."},{d:"Tue",c:"Wrote about building cars without engines. Sounds like a scam. It\u2019s not. Read it.",s:"Teaser."},{d:"Wed",c:"Work photo. \u201CThree meetings. Three introductions. Zero engines required.\u201D",s:"Real photo."},{d:"Thu",c:"\u201CEfficiency isn\u2019t adding more. It\u2019s wasting less. This applies to code, teams, and LinkedIn posts. (Especially LinkedIn posts.)\u201D",s:"Cream bg."},{d:"Fri",c:"\u201CWatching someone I introduced land their dream role. Better than any product launch.\u201D",s:"Warm bg."},{d:"Sat",c:"Nature photo. \u201CGravity: the original product manager. Ships on time, every time.\u201D",s:"Photo + nerd humor."}],tv:{goal:"College batchmates surface with shared memories.",actions:[{who:"Derby car teammates",what:"Comment with photos or memories",how:"Tag them. DM: \u201CRemember our derby cars? Got any photos?\u201D",why:"Old teammates + nostalgia = deep engagement."},{who:"Professor from BITS Pilani",what:"Comment validating AK\u2019s early instincts",how:"Email: \u201CWrote about the derby project. If you remember, a comment would be incredible.\u201D",why:"Academic validation carries weight."}]}},
{wk:10,m:3,ph:"Authority",pillar:"\uD83E\uDD1D The Catalyst",li:{ty:"Contrarian Take",ti:"Stop Networking. Start Noticing.",hk:"Unpopular opinion: Networking events are mostly a waste of time. And I say this as someone whose entire reputation is built on connecting people.",cp:"Unpopular opinion: Networking events are mostly a waste of time.\n\nAnd I say this as someone whose entire reputation is built on connecting people. So hear me out before you throw your business card at me.\n\nThe problem isn\u2019t the people. It\u2019s the intention.\n\nMost people walk into networking events to GET something. A lead. A contact. A card they\u2019ll never follow up on.\n\nIn 25 years, my most valuable connections happened because I was paying attention, not networking.\n\n\u2192 I noticed a junior engineer who asked the kind of questions her seniors were afraid to ask. I introduced her to someone who could challenge her. She\u2019s now a CTO.\n\n\u2192 I noticed a founder struggling with a problem I\u2019d literally seen solved in a different industry. One phone call. Done.\n\n\u2192 I noticed two people in my network who\u2019d been circling the same space for years without knowing each other. I sent a WhatsApp. They\u2019re now business partners.\n\nNetworking is transactional. Noticing is generous.\n\nNetworking says: \u201CWhat can you do for me?\u201D\nNoticing says: \u201CI see something in you that you might not see yet.\u201D\n\nStop collecting contacts. Start paying attention.\n\nOne right introduction at the right time is worth more than 500 business cards, 200 LinkedIn connections, and every networking event you\u2019ll attend this year. Combined.\n\nNow I have a genuine question: How did YOUR most important professional relationship actually start? I bet it wasn\u2019t at a networking event.",ds:{format:"Text post. Controversial hook.",visual:"None. Hot takes work best as text.",palette:"N/A",font:"Punchy lines. Arrows. Contrast structure (networking vs noticing).",cta:"Genuine question about THEIR best connection."},ht:"#Networking #Relationships #Leadership #Unpopular"},wa:[{d:"Mon",c:"\u201CStop collecting contacts. Start paying attention to people. (Also, stop putting \u2018open to connect\u2019 on LinkedIn. We\u2019re all open to connect. It\u2019s LinkedIn.)\u201D",s:"Dark bg. White text."},{d:"Tue",c:"Just told LinkedIn that networking events are useless. My inbox is going to be fun.",s:"Teaser."},{d:"Wed",c:"Meeting photo. \u201CThe best connections happen when nobody\u2019s trying to network.\u201D",s:"Candid."},{d:"Thu",c:"\u201CNetworking is transactional. Noticing is generous. I\u2019ll fight anyone who disagrees. (Verbally. I\u2019m an engineer, not a boxer.)\u201D",s:"Purple bg."},{d:"Fri",c:"\u201CTwo people I introduced 6 months ago just signed a deal together. My ROI on phone calls remains undefeated.\u201D",s:"Green bg."},{d:"Sat",c:"Personal. \u201CWeekend networking plan: Zero events. One good book. One long walk. One unsolicited phone call to a friend.\u201D",s:"Anti-hustle."}],tv:{goal:"Flood comments with \u201CAK introduced me to...\u201D stories.",actions:[{who:"5-8 people AK has connected",what:"Comment with their specific story",how:"\u201CPosting about introductions vs networking. If I\u2019ve connected you to someone who mattered, even one line in the comments would mean a lot.\u201D",why:"5+ independent confirmations in one post = undeniable proof."},{who:"2-3 beneficiaries",what:"Post their own \u201Cpower of introductions\u201D post that week",how:"\u201CGreat week to share your own story if you\u2019ve ever felt like it.\u201D",why:"Multiple posts pointing back to AK. Organic. Devastating."}]}},
{wk:11,m:3,ph:"Authority",pillar:"\uD83E\uDD1D The Catalyst",li:{ty:"Flagship Post",ti:"The Catalyst Manifesto",hk:"I\u2019ve never built my own empire. And honestly? I\u2019ve made my peace with that.",cp:"I\u2019ve never built my own empire.\n\nAnd honestly? I\u2019ve made my peace with that.\n\nIn 25 years, I\u2019ve designed aero engine test beds where mistakes were measured in casualties, not KPIs. Built derby cars without engines. (Still bragging.) Led teams at TCS, Cognizant, and Citec.\n\nSpent 9 years shipping 250+ ERP systems, an AI fact-checker now used by the Karnataka Police, forensic light sources for criminal investigations, and voice bots that handle thousands of conversations.\n\nStarted building something new \u2014 assembling weird, obsessive, niche teams that solve problems nobody else will touch. Right now: AI sentiment analysis platforms, sports performance wearables for football athletes, clinic management systems, and automated CAD pipelines.\n\nImpressive? Maybe. But the work I\u2019m most proud of doesn\u2019t have a logo.\n\nIt\u2019s the phone calls.\n\n\u201CYou two need to talk.\u201D\n\u201CI know someone who\u2019s perfect for this.\u201D\n\u201CTrust me on this one.\u201D\n\nI\u2019ve said these sentences hundreds of times. At 10 PM. Over chai. In airport lounges. On WhatsApp at completely inappropriate hours.\n\nI\u2019m not a mentor in the traditional sense. I don\u2019t do frameworks. (Okay, I did one framework post. It went well. Don\u2019t @ me.)\n\nI\u2019m a catalyst.\n\nI accelerate what\u2019s already there. I see potential before LinkedIn endorsements do. And I put the right people in the right rooms.\n\nHere\u2019s what 25 years of accidental wisdom boils down to:\n\n\u2192 Trust is built before business begins. If you\u2019re pitching on the first call, you\u2019ve already lost.\n\u2192 One right introduction outweighs a hundred cold emails, a thousand DMs, and every networking event ever invented.\n\u2192 The best way to grow? Help someone else grow first. The universe keeps a surprisingly accurate tab.\n\nIf you\u2019re building something meaningful and need the right people around you \u2014 let\u2019s have a conversation.\n\nNot a pitch. Not a meeting. A conversation. Over coffee. Or chai. I\u2019m not picky.\n\n(If you\u2019re here for polished corporate content, I\u2019m afraid you\u2019ve been warned since Week 1.)",ds:{format:"THE positioning post. No image. Let the words land.",visual:"None. This is manifesto territory. Graphics would dilute the sincerity.",palette:"N/A",font:"Short lines. Parenthetical humor. Arrows for principles. Emotional landing.",cta:"Soft CTA: \u2018Let\u2019s have a conversation.\u2019 Pin to Featured forever."},ht:"#PersonalBrand #Catalyst #Leadership #Trust #PeopleFirst"},wa:[{d:"Mon",c:"\u201CI don\u2019t build empires. I accelerate the people who do. And occasionally I photograph birds. Priorities.\u201D",s:"Black bg. Gold text."},{d:"Tue",c:"Just published the most honest thing I\u2019ve ever written. My wife approved it, which means it\u2019s either really good or she\u2019s stopped reading my posts.",s:"Cream bg."},{d:"Wed",c:"Event photo. \u201CThese conversations are my empire. Also, the chai here is excellent.\u201D",s:"Real photo."},{d:"Thu",c:"\u201CTrust is built before business begins. I wish someone had told me this in a LinkedIn carousel when I was 22. Oh wait, LinkedIn didn\u2019t exist.\u201D",s:"Dark bg. Serif."},{d:"Fri",c:"\u201C3 introductions this week. None were asked for. All were needed. My wife says I have a problem. She\u2019s right.\u201D",s:"Sage green."},{d:"Sat",c:"Celebratory photo. \u201C11 weeks of being on LinkedIn consistently. My cousin still hasn\u2019t forgiven me for the CNC machine. But at least I have followers now.\u201D",s:"Callback to Week 2."}],tv:{goal:"\uD83D\uDCA5 CATALYST DAY: 5 people post about AK simultaneously.",actions:[{who:"5 carefully chosen people AK has impacted",what:"Each posts their own \u201CAnanth Karthik\u201D story on the SAME DAY",how:"Coordinate 2 weeks ahead. Simple brief: In your own words \u2014 (1) How we met (2) What AK did (3) What changed. Post anytime Tuesday. Tag @Ananth Karthik.",why:"5 independent posts about the same person on the same day. LinkedIn will notice. Everyone will notice. This is the crescendo."},{who:"AK\u2019s WhatsApp broadcast",what:"Share 2-3 of these posts as Status",how:"Screenshot the best ones. Status: \u201CDidn\u2019t expect this today. Genuinely moved.\u201D (Humble. Not boastful.)",why:"Cross-pollination. Non-LinkedIn people see the proof on WhatsApp."}]}},
{wk:12,m:3,ph:"Authority",pillar:"\uD83E\uDD1D The Catalyst",li:{ty:"Reflection Post",ti:"12 Weeks of Being Loud on the Internet",hk:"12 weeks ago, I decided to stop being invisible on LinkedIn. Here\u2019s an honest report card.",cp:"12 weeks ago, I decided to stop being invisible on LinkedIn.\n\nHere\u2019s an honest report card:\n\n\u2714\uFE0F Things that went well:\n\u2192 14 introductions made. 6 led to real partnerships.\n\u2192 3 people told me a post genuinely changed how they approach problems.\n\u2192 1 person messaged saying a connection I made changed their career trajectory.\n\u2192 I learned that people actually WANT to hear real stories. Not frameworks. Not \u201C5 tips.\u201D Stories.\n\n\u274C Things that didn\u2019t go well:\n\u2192 I did not go viral. (My wife says this is a positive.)\n\u2192 My follower count didn\u2019t 10x. (It grew. But nobody is making a case study about it.)\n\u2192 I still don\u2019t know how the LinkedIn algorithm works. (Nobody does. Anyone who says they do is selling you something.)\n\u2192 I accidentally posted the same wildlife photo twice. One person noticed. Thanks, Rahul.\n\nBut here\u2019s what actually matters:\n\nBefore these 12 weeks, I was the guy who connected people behind the scenes. Quietly. Invisibly.\n\nNow I\u2019m the guy who connects people behind the scenes AND talks about it on the internet. Progress.\n\nSo what\u2019s next?\n\nMore of the same. But louder. And with better Wi-Fi.\n\nIf you\u2019re:\n\u2192 A founder looking for the right talent (not just \u201Ctalent\u201D)\n\u2192 A professional who\u2019s ready for a room they haven\u2019t been invited to yet\n\u2192 Someone with a problem they can\u2019t see around (because they\u2019re standing too close)\n\nDM me. No pitch. No deck. Just a conversation over chai.\n\nBecause after 12 weeks, I\u2019ve confirmed what I suspected all along: the best things I\u2019ve ever been part of started with someone saying:\n\n\u201CYou should talk to Ananth.\u201D\n\nLet\u2019s make more of those moments.\n\n(And to my wife: yes, I\u2019ll stop making phone calls at 10 PM. Starting next quarter.)",ds:{format:"Text post. Honest report card format with humor.",visual:"Optional: minimal scorecard graphic with the numbers.",palette:"White bg, gold numbers, dark text.",font:"Checkmarks and crosses for the report card. Parenthetical humor throughout.",cta:"DM prompt. Callback to earlier posts. Pin alongside Week 11."},ht:"#PersonalBrand #Catalyst #12WeekReview #Growth"},wa:[{d:"Mon",c:"\u201CThe best things start with: \u2018You should talk to Ananth.\u2019 And occasionally end with: \u2018Why did Ananth call me at 10 PM?\u2019\u201D",s:"Gold bg. White text."},{d:"Tue",c:"12 weeks done. Wrote an honest report card on LinkedIn. Spoiler: I didn\u2019t go viral.",s:"Cream bg."},{d:"Wed",c:"\u201CThis is just the beginning. Which is what every LinkedIn person says. But I actually mean it. Probably.\u201D",s:"Black bg. White text."},{d:"Thu",c:"Photo from the week. \u201CNew conversations every week. Some even at reasonable hours.\u201D",s:"Warm photo."},{d:"Fri",c:"\u201CThank you for 12 weeks. For reading. For connecting. For tolerating my jokes. Here\u2019s to the next 12.\u201D",s:"Heartfelt."},{d:"Sat",c:"Celebration photo. \u201CGood week. Good people. Questionable LinkedIn strategy. But we\u2019re here.\u201D",s:"Genuine."}],tv:{goal:"Convert buzz into permanent assets.",actions:[{who:"Week 11 posters",what:"Write LinkedIn recommendations on AK\u2019s profile",how:"\u201CWhat you shared last week was incredible. Would you add a short recommendation on my profile? 2-3 lines. It\u2019d mean the world.\u201D",why:"Recommendations are permanent. They outlast any post."},{who:"3 key people from the journey",what:"Record 30-60 second video testimonials",how:"\u201CWould you record a quick voice/video note? 30 seconds. On your phone. Whatever comes to mind about working with me.\u201D",why:"Video testimonials for website, future decks, next phase."},{who:"AK himself",what:"Gratitude post tagging everyone who participated",how:"Tag every person who posted, commented, shared. \u201CI didn\u2019t build this alone. These people showed up.\u201D",why:"Closes the loop. Sets up next 90 days."}]}}
