<!DOCTYPE html>
<html lang="en">
<head>

<title>The Catalyst's Playbook — Ananth Karthik S</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#FAFAF8;color:#1A1A1A;-webkit-font-smoothing:antialiased}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.wrap{max-width:960px;margin:0 auto;padding:44px 24px}
.center{text-align:center}

/* Header */
.hdr{text-align:center;margin-bottom:48px;animation:fadeIn .6s}
.tag{color:#B8860B;font-size:11px;text-transform:uppercase;letter-spacing:.25em;font-weight:700}
.serif{font-family:'Playfair Display',serif}
h1{font-size:clamp(30px,5vw,50px);font-weight:900;line-height:1.1;margin:12px 0 10px}
.sub{color:#6B6560;font-size:14px;max-width:520px;margin:0 auto;line-height:1.75}
.bar{width:48px;height:3px;background:#B8860B;margin:20px auto 0;border-radius:2px}

/* Nav */
.nav{display:flex;gap:3px;margin-bottom:32px;overflow-x:auto;padding:4px;background:#fff;border-radius:12px;border:1px solid rgba(0,0,0,.08);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.nav-btn{flex:1;min-width:fit-content;background:0;color:#6B6560;border:0;border-radius:9px;padding:10px 16px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:.25s;white-space:nowrap}
.nav-btn.on{background:#1A1A1A;color:#fff}

/* Cards */
.card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:18px 22px;box-shadow:0 1px 3px rgba(0,0,0,.03);margin-bottom:12px}
.card-flush{padding:0;overflow:hidden}

/* Badges */
.b{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600}
.b-li{background:rgba(10,102,194,.07);color:#0A66C2}
.b-wa{background:rgba(37,161,98,.07);color:#25A162}
.b-gd{background:rgba(184,134,11,.08);color:#B8860B}
.b-pp{background:rgba(107,70,193,.07);color:#6B46C1}
.b-ok{background:rgba(46,125,79,.08);color:#2E7D4F}
.b-no{background:rgba(197,48,48,.07);color:#C53030}

/* Grids */
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}

/* Sections */
.sec{display:none;animation:fadeIn .5s}
.sec.on{display:block}

/* Pills */
.pill{background:0;color:#6B6560;border:1.5px solid rgba(0,0,0,.08);border-radius:100px;padding:8px 22px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:.2s}
.pill.on-dark{background:#1A1A1A;color:#fff;border-color:#1A1A1A}
.pill.on-li{background:#0A66C2;color:#fff;border-color:#0A66C2}
.pill.on-wa{background:#25A162;color:#fff;border-color:#25A162}
.pill.on-gd{background:#B8860B;color:#fff;border-color:#B8860B}

/* Pillar cards */
.pc{background:#fff;border:1.5px solid rgba(0,0,0,.08);border-radius:14px;padding:22px;cursor:pointer;transition:.3s}
.pc.on{border-color:#B8860B;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.pc-detail{display:none;animation:fadeIn .3s;margin-top:12px}
.pc.on .pc-detail{display:block}

/* Coffee prompt */
.coffee{background:rgba(184,134,11,.08);border-left:3px solid #B8860B;padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:12px}

/* Week buttons */
.wk{width:32px;height:32px;border-radius:8px;border:1.5px solid rgba(0,0,0,.08);background:0;color:#6B6560;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:.2s}
.wk.on{background:#1A1A1A;color:#fff;border-color:#1A1A1A}

/* Table */
.tbl{display:grid;grid-template-columns:56px 1fr 1fr}
.tbl>div{padding:11px 12px;font-size:12px;border-bottom:1px solid rgba(0,0,0,.08)}
.tbl .bl{border-left:1px solid rgba(0,0,0,.08)}
.tbl .hd{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:#FAFAF8}

/* Utility */
.mt{margin-top:16px}.mb{margin-bottom:16px}.mb2{margin-bottom:24px}
.muted{color:#6B6560}.dim{color:#A09A94}.gold{color:#B8860B}
.li-c{color:#0A66C2}.wa-c{color:#25A162}.red-c{color:#C53030}.ok-c{color:#2E7D4F}
.sm{font-size:13px}.xs{font-size:11px}.xxs{font-size:10px}
.bold{font-weight:700}.semi{font-weight:600}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.lh{line-height:1.7}.flex{display:flex}.gap{gap:8px}.wrap-f{flex-wrap:wrap}.aic{align-items:center}
.pre{white-space:pre-wrap;word-break:break-word;font-family:inherit}
.bdr-t{border-top:1px solid rgba(0,0,0,.08);padding-top:16px;margin-top:16px}
.footer{text-align:center;margin-top:48px;padding-top:18px;border-top:1px solid rgba(0,0,0,.08)}
</style>
</head>

var WKS=[
{wk:1,m:1,ph:"Foundation",li:{ty:"Text Post",ti:"Profile Launch + Soft Intro",hk:"I spent my first month at Hindustan Aeronautics Limited folding drawings.",cp:"I spent my first month at Hindustan Aeronautics Limited folding drawings.\n\nNot designing. Not engineering. Folding.\n\nPaper sizes. Filing systems. Reading blueprints someone else made. I remember thinking — what am I even doing here?\n\nBut here's what that month actually taught me:\n\nBefore you build anything, you need to understand the foundation someone else laid. Before you design, you need to read. Before you lead, you need to listen.\n\n25 years later, I still fold before I build.\n\nWhether it's a business, a team, or a relationship — I don't start with the answer. I start by understanding every piece of the machine.\n\nWhat was your \"folding drawings\" moment?",ds:{format:"Text-only post (no image needed — the story carries it)",visual:"Clean. No graphic. Let LinkedIn's native text formatting do the work.",palette:"N/A — pure text post performs best for personal stories",font:"LinkedIn default. Line breaks for mobile readability.",cta:"End with an open question to drive comments"},ht:"#Leadership #Engineering #CareerLessons #FirstJob"},wa:[{d:"Mon",c:"\"Before you build, learn to fold.\" — something I learned at HAL 25 years ago.",s:"Dark charcoal bg (#1A1A1A). White serif text. Minimal."},{d:"Tue",c:"Photo of AK at workspace — candid. Caption: \"Day 1 of sharing what I've learned.\"",s:"Real photo. No filter. White text overlay at bottom."},{d:"Wed",c:"\"The best engineers I know don't start with solutions. They start with questions.\"",s:"Warm cream bg (#F5F0E6). Dark brown text. Centered."},{d:"Thu",c:"Throwback: Photo from BITS Pilani days. \"Where it all started.\"",s:"Old photo. Warm tone. Small white caption."},{d:"Fri",c:"\"Grateful for [Name] who taught me patience isn't passive — it's strategic.\"",s:"Soft green bg (#E8F5E9). Dark text. Personal."},{d:"Sat",c:"Weekend life photo — wildlife photography, family. No caption.",s:"Full photo. AK's photography. Authentic."}]},
{wk:2,m:1,ph:"Foundation",li:{ty:"Carousel (6 slides)",ti:"The CNC Factory Summers",hk:"Every vacation, while other kids played, I disappeared into a CNC factory.",cp:"[SLIDE 1 — Cover]\n\"The Boy in the Factory\"\nHow summer vacations shaped my engineering mind\n\n[SLIDE 2]\nEvery year, two months in Bangalore. My cousin owned a CNC factory. I'd show up at dawn and stay till they locked the gates.\n\n[SLIDE 3]\nI didn't understand half of what I saw. But I watched. I asked questions that probably annoyed everyone.\n\n[SLIDE 4]\nThat factory taught me: the world is a machine. Every problem has parts. Understand the parts, fix anything.\n\n[SLIDE 5]\n25 years later, I still approach every challenge the same way — dismantle, understand, rebuild better.\n\n[SLIDE 6 — CTA]\nWhat shaped your thinking before your career started?",ds:{format:"Carousel — 6 slides, swipeable",visual:"Editorial feel. Solid background + text per slide. No stock images.",palette:"Slide 1: Navy (#1a2744) + gold. Slides 2-5: Off-white (#FAF8F5). Slide 6: Gold (#B8860B) + white.",font:"Headlines: Playfair Display, 28-32px. Body: DM Sans, 16-18px.",cta:"Final slide asks a question + AK signature"},ht:"#SystemsThinking #Engineering #Curiosity"},wa:[{d:"Mon",c:"\"The world is a machine. Every problem has parts.\" — a CNC factory taught me at 14.",s:"Navy bg. Gold text. One quote."},{d:"Tue",c:"New carousel on LinkedIn — about the summers that shaped how I think.",s:"Carousel cover preview."},{d:"Wed",c:"Photo from a meeting. \"Some problems need a whiteboard. Most need a conversation.\"",s:"Real photo. White text overlay."},{d:"Thu",c:"\"I used to dismantle toys. Now I do the same with business problems.\"",s:"Warm beige bg. Dark serif text."},{d:"Fri",c:"Shoutout: \"If you haven't connected with [colleague], you should.\"",s:"Sage green bg. Dark text."},{d:"Sat",c:"Wildlife photo. No text.",s:"Full photo. AK's photography."}]},
{wk:3,m:1,ph:"Foundation",li:{ty:"Text Post + Image",ti:"The Drawing Folder",hk:"My first assignment as a design engineer at HAL: learn to fold drawings.",cp:"My first assignment as a design engineer at HAL: learn to fold drawings.\n\nFor a month.\n\nWeek 1: Paper sizes and folding techniques.\nWeek 2: Filing systems. Fetching drawings for senior designers.\nWeek 3: Reading drawings I didn't create.\nWeek 4: Asking so many questions they probably regretted hiring me.\n\nI was frustrated. I had a degree. I wanted to design. Instead, I was folding paper.\n\nBut that month gave me something no textbook could:\n\n→ Respect for the work that came before me\n→ The patience to learn before trying to lead\n→ The confidence to ask \"why\" until I truly understood\n\nThe best careers aren't built on shortcuts.\n\nWhat's your \"folding drawings\" story?",ds:{format:"Text post with optional single image",visual:"Minimal graphic: quote on dark background. Or pure text — strong hooks outperform.",palette:"Charcoal (#2D2D2D), cream text (#FAF8F5), gold line accent",font:"Serif heading, sans-serif subtext. Large whitespace.",cta:"Direct question. Reply to every comment."},ht:"#Patience #Engineering #HAL #CareerGrowth"},wa:[{d:"Mon",c:"\"Learn to fold before you build.\" — My first lesson at HAL.",s:"Black bg. White text. One line."},{d:"Tue",c:"Photo from workspace. \"Still folding. Still learning. 25 years later.\"",s:"Real photo. Warm tone. Small text."},{d:"Wed",c:"\"The best careers aren't built on shortcuts.\"",s:"Cream bg. Dark brown serif text."},{d:"Thu",c:"Old photo from engineering days. \"2001. The drawing board. Before AutoCAD.\"",s:"Throwback photo. Warm filter."},{d:"Fri",c:"\"Connected two incredible people this week. Nothing beats the right conversation.\"",s:"Soft blue bg (#E3F2FD). Dark text."},{d:"Sat",c:"Nature/wildlife shot. No text.",s:"Full photo. Let it breathe."}]},
{wk:4,m:1,ph:"Foundation",li:{ty:"People Spotlight",ti:"First Catalyst Story",hk:"Three years ago, someone told me about a young engineer who couldn't get a break.",cp:"Three years ago, someone told me about a young engineer who couldn't get a break.\n\nGreat skills. Wrong connections. No one to vouch for him.\n\nI made one phone call. Introduced him to someone who was hiring.\n\nThat \"young engineer\" is now leading a team of 15.\n\nI didn't mentor him. I didn't coach him.\n\nI just connected the right person with the right opportunity at the right time.\n\nThat's what I've learned matters most in 25 years:\n\nIt's not about what you build. It's about who you put in the room.\n\nIf you know someone who deserves a better shot — make the call. Be the catalyst.\n\nTag someone who gave YOU that one introduction that changed everything.",ds:{format:"Text post — pure storytelling. No image.",visual:"Let the narrative carry it. Human stories are LinkedIn gold.",palette:"N/A — native text",font:"Short paragraphs. One-line sentences for impact.",cta:"Double CTA: Tag someone + share their story. Drives reach."},ht:"#PeopleFirst #Catalyst #Mentorship #Connections"},wa:[{d:"Mon",c:"\"It's not about what you build. It's about who you put in the room.\"",s:"Dark slate bg (#334155). White text."},{d:"Tue",c:"New LinkedIn post — one phone call that changed someone's career.",s:"Cream bg. Dark text. Teaser."},{d:"Wed",c:"Photo with a colleague. \"Good conversations > good presentations.\"",s:"Real photo. White text overlay."},{d:"Thu",c:"\"Someone once made a phone call that changed my career. Paying it forward.\"",s:"Warm terracotta bg (#D4A574). Dark text."},{d:"Fri",c:"\"In [industry] looking for [role]? DM me. I might know someone.\"",s:"White bg. Bold dark text. Actionable."},{d:"Sat",c:"Weekend photo. Nature, family.",s:"Full photo. Authentic."}]},
{wk:5,m:2,ph:"Momentum",li:{ty:"Framework Post + Graphic",ti:"The Machine Thinker",hk:"I can't solve a problem unless I see the whole machine.",cp:"I can't solve a problem unless I see the whole machine.\n\nWhen someone brings me a challenge — a broken process, a team conflict — I don't jump to the fix.\n\nI dismantle it.\n\nHere's my framework (from 4 years of designing aero engine test beds at HAL):\n\n1. MAP THE MACHINE → What are ALL the moving parts?\n2. FIND THE FRICTION → Where is energy being wasted?\n3. TRACE THE CONNECTIONS → How does changing Part A affect Part B, C, D?\n4. REBUILD FROM FIRST PRINCIPLES → Don't patch. Redesign.\n\nWhen one mistake can cost lives — you don't guess. You understand.\n\nWhat's your go-to framework for solving complex problems?",ds:{format:"Text + supporting graphic showing the 4-step framework",visual:"Clean infographic. 4 steps vertical flow. Icon + title + one line each.",palette:"White bg, dark text. Gold (#B8860B) step numbers. Thin dark connecting lines.",font:"Step numbers: Playfair 48px gold. Titles: Bold sans 18px. Desc: 14px muted.",cta:"Question at end. Share as carousel if engagement is strong."},ht:"#SystemsThinking #ProblemSolving #Framework #Strategy"},wa:[{d:"Mon",c:"\"Don't fix the symptom. Understand the machine.\"",s:"Charcoal bg. White text. One line."},{d:"Tue",c:"Shared a 25-year-old framework on LinkedIn. From test beds where mistakes cost lives.",s:"Screenshot of framework graphic."},{d:"Wed",c:"Photo at desk/whiteboard. \"This is what my Monday looks like.\"",s:"Real candid photo. White text."},{d:"Thu",c:"\"The best leaders don't have all the answers. They have better questions.\"",s:"Soft navy bg (#1E3A5F). White serif text."},{d:"Fri",c:"\"Introduced [A] to [B] today. Sometimes just get out of the way and let two smart people talk.\"",s:"Sage green bg. Dark text."},{d:"Sat",c:"Wildlife/nature photo.",s:"AK's photography. Full frame."}]},
{wk:6,m:2,ph:"Momentum",li:{ty:"Opinion/Industry Post",ti:"Innovation vs. Maintenance",hk:"Everyone talks about innovation. Almost nobody talks about maintenance.",cp:"Everyone talks about innovation. Almost nobody talks about maintenance.\n\nIn my 4 years at HAL: 100% safety wasn't a target — it was the minimum.\n\nThat taught me: real innovation isn't about the new thing. It's about understanding the existing thing so deeply that you know exactly where to improve.\n\nThree types of design:\n→ Reverse engineering (understanding what exists)\n→ Incremental design (improving what exists)\n→ New product design (creating what doesn't exist)\n\nMost people skip to #3. The best engineers master #1 first.\n\nIs the obsession with \"disruption\" causing us to neglect the power of deep understanding?",ds:{format:"Text post. Optional: pyramid graphic of 3 design types",visual:"Clean pyramid with 3 layers. Gold accent.",palette:"Off-white bg. Dark text. Gold hierarchy accent.",font:"Sans-serif body. Serif for design type labels.",cta:"Provocative question sparks debate."},ht:"#Innovation #Engineering #Leadership #DesignThinking"},wa:[{d:"Mon",c:"\"Real innovation = understanding the existing thing deeply enough to improve it.\"",s:"Cream bg. Dark serif text."},{d:"Tue",c:"Posted something spicy on LinkedIn. Let's see if the engineering community agrees.",s:"Light gray bg. Text teaser."},{d:"Wed",c:"Work photo. \"Whiteboard session ran 3 hours. Best kind of meeting — no slides.\"",s:"Real photo. Small white caption."},{d:"Thu",c:"\"Three types of design: Reverse engineer → Improve → Create. Don't skip step 1.\"",s:"White bg. Bold dark text."},{d:"Fri",c:"\"[Name] has been doing incredible work in [space]. Follow them.\"",s:"Soft bg. Personal recommendation."},{d:"Sat",c:"Personal photo.",s:"Authentic. No text."}]},
{wk:7,m:2,ph:"Momentum",li:{ty:"People Spotlight #2",ti:"Second Catalyst Story",hk:"She had the skills. She didn't have the room.",cp:"She had the skills. She didn't have the room.\n\nTwo years ago — a product manager at an event. Sharp thinking. Stuck in a role below her potential.\n\nI asked: \"If you could work anywhere, what would you build?\"\n\nHer answer was so specific, so passionate, I immediately thought of someone who needed that energy.\n\nOne introduction later, she's leading product for a team that's tripled in size.\n\nI didn't do the work. She did. I just opened a door she didn't know existed.\n\n→ Talent is everywhere. Opportunity is not.\n→ The most powerful thing you can do is believe in someone before they've proven themselves.\n→ One right introduction > 100 motivational speeches.\n\nWho in your network deserves a door opened? Tag them.",ds:{format:"Text post — storytelling. No image.",visual:"Pure text. Human stories are LinkedIn gold.",palette:"N/A — native text",font:"Short paragraphs. Arrow (→) for takeaways.",cta:"Tag prompt drives massive reach."},ht:"#Talent #Opportunity #PeopleFirst #Catalyst"},wa:[{d:"Mon",c:"\"Talent is everywhere. Opportunity is not. Be the bridge.\"",s:"Dark teal bg (#134E4A). White text."},{d:"Tue",c:"Story on LinkedIn about one introduction that changed a career.",s:"Cream bg. Teaser."},{d:"Wed",c:"Coffee meeting photo. \"Best meetings happen without agendas.\"",s:"Real photo. Warm tones."},{d:"Thu",c:"\"Before I introduce two people: will this conversation make both of them better?\"",s:"Soft amber bg (#FEF3C7). Dark text."},{d:"Fri",c:"\"Looking for [role] for a friend's startup. DM me.\"",s:"White bg. Bold text. Actionable."},{d:"Sat",c:"Weekend. Nature or personal.",s:"Photo. No text."}]},
{wk:8,m:2,ph:"Momentum",li:{ty:"Carousel (8 slides)",ti:"4 Years at HAL — Visual Story",hk:"From drawing boards to aero engine test beds. 4 years that shaped everything.",cp:"[SLIDE 1] \"4 Years at HAL\" — The years that shaped everything.\n\n[SLIDE 2] Year 1: The Drawing Board. Folded drawings. Read blueprints. Foundation: laid.\n\n[SLIDE 3] Once trusted, I touched AutoCAD. I wasn't just drawing lines — I understood what they meant.\n\n[SLIDE 4] Beyond my lane: 60% reverse engineering, 20% incremental, 20% new product design.\n\n[SLIDE 5] Structural components. Vibrations. Acoustics. Hydraulics. I wanted to touch every part.\n\n[SLIDE 6] Year 4: Monitoring an entire test bed at an Air Force base. Alone.\n\n[SLIDE 7] \"100% safety. Zero room for error.\" This principle shaped every decision since.\n\n[SLIDE 8] What was the job that shaped your professional DNA?",ds:{format:"Carousel — 8 slides. Swipeable memoir.",visual:"Cinematic editorial. Solid color bg + text. NO stock images.",palette:"Slide 1: Navy (#0F172A) + gold. Slides 2-7: Alternate off-white and charcoal. Slide 8: Gold + white.",font:"Headlines: Playfair 28-36px. Body: DM Sans 16px. Year labels: mono, uppercase, 12px, gold.",cta:"Final slide: question + AK signature"},ht:"#HAL #AeroEngineering #CareerStory #Engineering"},wa:[{d:"Mon",c:"\"100% safety. Zero room for error.\" — The principle from HAL that runs my life.",s:"Navy bg. White text."},{d:"Tue",c:"My HAL story in 8 slides on LinkedIn. 4 years compressed.",s:"Carousel cover preview."},{d:"Wed",c:"Work photo. \"Still the same curiosity. Just bigger machines.\"",s:"Real photo. Small text."},{d:"Thu",c:"\"Every machine is a system. Every system has a story. I read both.\"",s:"Soft gray bg. Dark serif text."},{d:"Fri",c:"\"Connected manufacturing + tech this week. Different worlds. Same problem. Magic.\"",s:"Green bg. Genuine."},{d:"Sat",c:"Weekend photo.",s:"Authentic."}]},
{wk:9,m:3,ph:"Authority",li:{ty:"Story Post + Image",ti:"The Derby Car Story",hk:"In engineering college, I built two cars. Neither had an engine.",cp:"In engineering college, I built two cars. Neither had an engine.\n\nDerby cars — full vehicles relying on gravity, design, precision. Roll them down a slope. Speed and braking tell you everything.\n\nNo motor to hide behind. Just physics and craft.\n\nEverything since has been derby-car thinking.\n\n→ Strip the noise. What's actually driving this?\n→ Can't compensate with power? Get the design right.\n→ Efficiency isn't adding more. It's wasting less.\n\nWhether building a team, launching a venture, or connecting two people — I still design without an engine.\n\nLet the fundamentals do the work.\n\nWhat's your derby car?",ds:{format:"Text + minimalist line-art graphic of a derby car",visual:"Simple line-art silhouette on clean background.",palette:"White bg, charcoal line art, gold accent on wheels.",font:"'Derby Car Thinking' in Playfair as caption below illustration.",cta:"Open question. High reshare potential."},ht:"#Engineering #FirstPrinciples #Design #Resourcefulness"},wa:[{d:"Mon",c:"\"No engine. Just design. That's how I learned to build.\"",s:"White bg. Bold dark text."},{d:"Tue",c:"New post about building cars without engines. Sounds weird. Read it.",s:"Light bg. Teaser."},{d:"Wed",c:"Work photo. \"Three meetings, three introductions. Good day.\"",s:"Real photo. Small text."},{d:"Thu",c:"\"Efficiency isn't adding more. It's wasting less.\"",s:"Cream bg. Serif text."},{d:"Fri",c:"\"Met someone who reminded me why I do this. Watching someone find their role.\"",s:"Warm bg. Personal."},{d:"Sat",c:"Nature/wildlife.",s:"AK's photography."}]},
{wk:10,m:3,ph:"Authority",li:{ty:"Contrarian Take",ti:"Stop Networking. Start Noticing.",hk:"Unpopular opinion: Networking events are mostly useless.",cp:"Unpopular opinion: Networking events are mostly useless.\n\nNot the people. The intention.\n\nMost people go to GET something. A lead. A card.\n\nIn 25 years, my best connections happened because I was paying attention, not networking.\n\n→ Noticed a junior engineer asking questions seniors avoided. Introduced her to someone who could challenge her.\n→ Noticed a founder with a problem I'd seen solved elsewhere. One phone call.\n→ Noticed two people who should know each other. Sent a text.\n\nNetworking is transactional. Noticing is generous.\n\nStop collecting contacts. Start paying attention to people.\n\nOne right introduction > 500 business cards.\n\nHow did your best professional relationship start?",ds:{format:"Text post. No graphic — the controversial hook drives engagement.",visual:"None. 'Unpopular opinion' hook performs extremely well as plain text.",palette:"N/A",font:"Short punchy lines. Arrow (→) for examples.",cta:"Agree/disagree drives massive comments."},ht:"#Networking #Relationships #Leadership"},wa:[{d:"Mon",c:"\"Stop collecting contacts. Start paying attention to people.\"",s:"Dark bg. White text. Bold."},{d:"Tue",c:"Posted something that might ruffle feathers. My take on networking events.",s:"Simple text teaser."},{d:"Wed",c:"Meeting photo. \"Best connections happen when you're not trying.\"",s:"Candid photo. Small caption."},{d:"Thu",c:"\"Networking is transactional. Noticing is generous.\"",s:"Soft purple bg (#EDE9FE). Dark text."},{d:"Fri",c:"\"Two people I introduced 6 months ago now work together. Best ROI I know.\"",s:"Green bg. Warm."},{d:"Sat",c:"Personal moment.",s:"Photo. No text."}]},
{wk:11,m:3,ph:"Authority",li:{ty:"Flagship Post",ti:"The Catalyst Manifesto",hk:"I've never built my own empire. And I never plan to.",cp:"I've never built my own empire. And I never plan to.\n\nIn 25 years: aero engine test beds. Derby cars without engines. Teams at TCS, Cognizant, Citec. Now Lenor Ventures.\n\nBut the work I'm most proud of? None of that.\n\nIt's the introductions.\n\n\"You two need to talk.\"\n\"I know someone perfect for this.\"\nCoffees where I just listened — then connected the dots.\n\nI'm a catalyst.\n\nI accelerate what's already there. I see potential before it's obvious. I put the right people in the right rooms.\n\n→ Trust is built before business begins.\n→ One right introduction > a hundred cold pitches.\n→ The best way to grow is to help someone else grow first.\n\nIf you're building something meaningful — let's have a conversation.\n\nNot a pitch. A conversation.",ds:{format:"Text post — THE positioning post. No image. Let the words land.",visual:"None. Pure manifesto. Graphics would dilute it.",palette:"N/A",font:"Short lines. Dashes for drama. Arrows for principles.",cta:"Soft CTA: 'Let's have a conversation.' Pin to Featured."},ht:"#PersonalBrand #Catalyst #Leadership #Trust #PeopleFirst"},wa:[{d:"Mon",c:"\"I don't build empires. I accelerate the people who do.\"",s:"Black bg. Gold text. Powerful."},{d:"Tue",c:"Wrote something very personal on LinkedIn. Most honest post I've ever shared.",s:"Cream bg. Understated."},{d:"Wed",c:"Event/meeting photo. \"These conversations are what I live for.\"",s:"Real photo. Genuine."},{d:"Thu",c:"\"Trust is built before business begins.\"",s:"Dark bg. White serif text."},{d:"Fri",c:"\"Made 3 introductions this week. None asked for. All needed.\"",s:"Sage green. Dark text."},{d:"Sat",c:"Weekend photo.",s:"Authentic."}]},
{wk:12,m:3,ph:"Authority",li:{ty:"Forward-Looking Post",ti:"What's Next — Open Door",hk:"12 weeks ago, I started sharing what I've learned. Here's what happened.",cp:"12 weeks ago, I started sharing more. Here's what happened.\n\nI didn't go viral. I didn't become a \"LinkedIn influencer.\" (Thank God.)\n\nBut:\n→ 14 introductions. 6 led to real partnerships.\n→ 3 people said a post changed how they think.\n→ 1 person said a connection I made changed their career.\n→ Dozens of conversations that wouldn't have happened.\n\nNone from a strategy deck. All from showing up consistently.\n\nSo here's what's next — doubling down on connecting people.\n\nIf you're:\n→ A founder looking for the right talent\n→ A professional ready for a new challenge\n→ Someone with a problem you can't see around\n\nDM me. Let's talk. No pitch. Just coffee.\n\nBecause the best things start with: \"You should talk to Ananth.\"\n\nLet's make more of those moments.",ds:{format:"Text post with results. Optional: minimal scorecard graphic.",visual:"Clean scorecard: 14 intros, 6 partnerships, etc.",palette:"White bg, dark text, gold accent on numbers.",font:"Numbers: Large serif gold. Labels: Small sans muted.",cta:"Ultimate CTA post. DM-driving. Pin-worthy."},ht:"#PersonalBrand #Catalyst #Reflection #Growth"},wa:[{d:"Mon",c:"\"The best things start with: 'You should talk to Ananth.'\"",s:"Gold bg (#B8860B). White text."},{d:"Tue",c:"12 weeks of sharing, connecting, showing up. Reflection on LinkedIn.",s:"Cream bg. Teaser."},{d:"Wed",c:"\"This is just the beginning.\"",s:"Black bg. White text. Forward-looking."},{d:"Thu",c:"Photo from the week. \"Every week, new conversations. New possibilities.\"",s:"Real photo. Warm. Small caption."},{d:"Fri",c:"\"Thank you for being here. For reading. For trusting. Here's to the next 12 weeks.\"",s:"Soft warm bg. Heartfelt."},{d:"Sat",c:"Personal celebration photo. \"Good week. Good people. Good life.\"",s:"Authentic. Genuine smile."}]}
];

// ════════════════════════════════════════
//  STATE
// ════════════════════════════════════════
var state = {sec:"overview", pill:0, wk:0, wtab:"li", pview:"before"};

// ════════════════════════════════════════
//  RENDER FUNCTIONS
// ════════════════════════════════════════
function esc(s){return s.replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function renderNav(){
  var tabs=[{id:"overview",l:"Overview"},{id:"profile",l:"Profile Mockup"},{id:"content",l:"Content Plan"},{id:"rhythm",l:"Weekly Rhythm"}];
  document.getElementById("nav").innerHTML=tabs.map(function(t){
    return '<button class="nav-btn'+(state.sec===t.id?' on':'')+'" onclick="go(\''+t.id+'\')">'+t.l+'</button>';
  }).join("");
}

function go(id){state.sec=id;renderNav();render()}

function render(){
  var el=document.getElementById("app");
  if(state.sec==="overview") el.innerHTML=renderOverview();
  else if(state.sec==="profile") el.innerHTML=renderProfile();
  else if(state.sec==="content") el.innerHTML=renderContent();
  else if(state.sec==="rhythm") el.innerHTML=renderRhythm();
}

function renderOverview(){
  return '<div style="animation:fadeIn .5s">'+
  '<div class="card" style="padding:28px 24px;margin-bottom:18px">'+
    '<h2 class="serif" style="font-size:21px;margin-bottom:18px">Who is Ananth Karthik?</h2>'+
    '<div class="g4" style="margin-bottom:22px">'+
    [{l:"Positioning",v:"The Catalyst",i:"⚡"},{l:"Superpower",v:"Connecting the right people",i:"🤝"},{l:"Philosophy",v:"Trust first, business later",i:"💎"},{l:"Style",v:"Holistic systems thinker",i:"🔍"}].map(function(x){
      return '<div style="background:#FAFAF8;border-radius:10px;padding:16px;border:1px solid rgba(0,0,0,.08)">'+
        '<span style="font-size:18px">'+x.i+'</span>'+
        '<p class="dim lbl" style="margin:7px 0 2px">'+x.l+'</p>'+
        '<p class="serif bold" style="font-size:14px">'+x.v+'</p></div>';

    '<div class="bdr-t">'+
      '<p class="dim lbl" style="margin-bottom:8px">The one-year answer</p>'+
      '<p class="serif" style="font-size:17px;font-style:italic;line-height:1.5">"When someone says Ananth Karthik — what do people say next?"</p>'+
      '<p class="gold bold" style="font-size:14px;margin-top:8px">→ "He sees potential before it\'s obvious — and connects it to the right opportunity."</p>'+
    '</div></div>'+
  '<div class="g2">'+
    '<div class="card"><div class="flex aic gap" style="margin-bottom:10px"><div style="width:8px;height:8px;border-radius:50%;background:#0A66C2"></div><span class="li-c bold" style="font-size:14px">LinkedIn</span><span class="dim xs">— The Stage</span></div><p class="muted sm lh" style="margin-bottom:12px">Authority-building through storytelling, frameworks, and people spotlights. 2 posts per week + daily engagement.</p><span class="b b-li">2 posts/week</span></div>'+

  '</div></div>';
}

function renderProfile(){
  var v=state.pview;
  var bef={hl:"Inventor | Nemophilist | Wildlife Photographer | Mentor",bn:"Quality. Innovation. Cost. Delivery. — Endless Innovation",ab:"I've worn many hats — from consulting and client management to portfolio strategy...",ft:["It is all in your Attitude!!","We have come across many people who harp upon why they charge..."],items:["Headline diluted — 'Nemophilist' doesn't communicate value","Banner is generic corporate — tells no one what AK does","Featured posts are motivational/generic — not catalyst stories","Activity: only 'Congrats!' comments from 10 months ago","No positioning — visitor doesn't know why they should care","About reads like a resume, not a promise"]};
  var aft={hl:"I accelerate the people who build companies | Founder, Lenor Ventures | 25 yrs Engineering → Strategy → People",bn:"The Catalyst — Trust first. Business later. Connecting the right people to the right opportunities.",ab:"I spent 4 years at HAL designing aero engine test beds where one mistake could be fatal. That taught me precision.\n\nI spent 8 years at TCS building systems at scale. That taught me patience.\n\nBut the most important thing I learned: the right person in the right role changes everything.\n\nToday, I accelerate the people who build. I connect founders with talent, leaders with mentors, ideas with the people who make them real.\n\nIf you're building something meaningful, let's talk.",ft:["\"My first job was to fold drawings. For a month.\"","\"She had the skills. She didn't have the room.\"","\"I've never built my own empire. And I never plan to.\""],items:["Headline instantly communicates the Catalyst value","Banner reinforces trust-first philosophy","Featured posts showcase real stories from content pillars","About tells a story arc: precision → patience → people","Clear CTA: 'If you're building something meaningful, let's talk'","Weekly activity builds trust and algorithmic reach"]};
  var d=v==="before"?bef:aft;
  var isB=v==="before";
  return '<div style="animation:fadeIn .5s">'+
    '<p class="muted sm lh mb">Based on Ananth Karthik\'s current LinkedIn. Toggle to see the transformation.</p>'+
    '<div class="flex gap mb" style="margin-bottom:20px">'+
      '<button class="pill'+(isB?' on-dark':'')+'" onclick="state.pview=\'before\';render()">🔴 Current</button>'+
      '<button class="pill'+(!isB?' on-dark':'')+'" onclick="state.pview=\'after\';render()">🟢 Recommended</button>'+
    '</div>'+
    '<div class="card" style="padding:0;overflow:hidden;border-radius:16px;margin-bottom:16px">'+
      '<div class="profile-banner" style="background:'+(isB?'linear-gradient(135deg,#1a5276,#2980b9)':'linear-gradient(135deg,#1A1A1A,#3d3d3d)')+'"><p style="color:#fff;font-size:12px;font-weight:600;text-align:center;opacity:.9;line-height:1.5">'+esc(d.bn)+'</p></div>'+
      '<div style="padding:0 22px 22px">'+
        '<div class="profile-avatar" style="background:'+(isB?'#2980b9':'#B8860B')+'">AK</div>'+
        '<h3 class="serif bold" style="font-size:17px;margin-bottom:3px">Ananth Karthik S</h3>'+
        '<p class="sm" style="color:'+(isB?'#6B6560':'#1A1A1A')+';margin-bottom:5px;line-height:1.5;font-weight:'+(isB?'400':'500')+'">'+esc(d.hl)+'</p>'+
        '<p class="dim xs" style="margin-bottom:10px">Chennai, Tamil Nadu · 5,944 followers</p>'+
        '<div class="bdr-t"><p class="xs bold" style="margin-bottom:6px">About</p><p class="muted xs lh" style="white-space:pre-line">'+esc(d.ab)+'</p></div>'+
        '<div class="bdr-t"><p class="xs bold" style="margin-bottom:8px">Featured</p><div class="flex gap" style="overflow-x:auto">'+d.ft.map(function(f){
          return '<div style="min-width:160px;background:#FAFAF8;border-radius:8px;padding:10px 12px;border:1px solid rgba(0,0,0,.08);font-size:11px;color:'+(isB?'#6B6560':'#1A1A1A')+';line-height:1.5;'+(isB?'':'font-style:italic')+'">'+esc(f)+'</div>';
        }).join("")+'</div></div>'+
      '</div></div>'+
    '<div class="card">'+
      '<p class="lbl '+(isB?'red-c':'ok-c')+'" style="margin-bottom:10px">'+(isB?'🔴 Issues identified':'🟢 Improvements')+'</p>'+

      }).join("")+
    '</div></div>';
}

function renderContent(){
  var ap=state.pill;
  var aw=state.wk;
  var at=state.wtab;
  var w=WKS[aw];

  // Pillars section
  var pillarsHTML='<p class="muted sm lh" style="margin-bottom:16px">Four content territories AK owns. Every post and status maps to one. Tap to expand.</p>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:32px">'+
    PILLS.map(function(p,i){
      var on=ap===i;
      return '<div class="pc'+(on?' on':'')+'" onclick="state.pill='+i+';render()">'+
        '<div style="font-size:26px;margin-bottom:8px">'+p.icon+'</div>'+
        '<h3 class="serif bold" style="font-size:15px;margin-bottom:2px">'+esc(p.title)+'</h3>'+
        '<p class="gold" style="font-size:11px;font-style:italic;margin-bottom:10px">'+esc(p.tag)+'</p>'+
        '<div class="pc-detail">'+
          '<p class="muted sm lh" style="margin-bottom:12px">'+esc(p.desc)+'</p>'+
          '<div class="coffee"><p class="dim lbl" style="margin-bottom:4px">☕ Coffee prompt</p><p style="font-size:12px;font-style:italic;line-height:1.5">'+esc(p.prompt)+'</p></div>'+
          '<div class="flex gap wrap-f"><span class="b b-li">LI: '+esc(p.li)+'</span><span class="b b-wa">WA: '+esc(p.wa)+'</span></div>'+
        '</div></div>';
    }).join("")+'</div>';

  // Divider
  var divHTML='<div style="border-top:2px solid rgba(0,0,0,.06);padding-top:28px;margin-bottom:16px"><h2 class="serif" style="font-size:20px;margin-bottom:4px">12-Week Execution Plan</h2><p class="muted sm">Full LinkedIn copy, WhatsApp status scripts, and design briefs for each week.</p></div>';

  // Week selector
  var months=[{l:"Month 1: Foundation",w:[0,1,2,3]},{l:"Month 2: Momentum",w:[4,5,6,7]},{l:"Month 3: Authority",w:[8,9,10,11]}];
  var wkSelHTML='<div class="flex gap wrap-f aic" style="margin-bottom:20px">'+
    months.map(function(m,mi){
      return '<span class="dim" style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-right:2px">'+m.l+':</span>'+
        m.w.map(function(wi){return '<button class="wk'+(aw===wi?' on':'')+'" onclick="state.wk='+wi+';state.wtab=\'li\';render()">'+(wi+1)+'</button>';}).join("")+
        (mi<2?'<div style="width:1px;height:20px;background:rgba(0,0,0,.08);margin:0 6px"></div>':'');
    }).join("")+'</div>';

  // Week detail
  var badges='<div class="flex gap wrap-f" style="margin-bottom:6px"><span class="b b-pp">'+esc(w.li.ty)+'</span><span class="b b-gd">Month '+w.m+' · '+esc(w.ph)+'</span></div>';
  var title='<h3 class="serif" style="font-size:20px;margin:8px 0 4px">'+esc(w.li.ti)+'</h3>';
  var tabs='<div class="flex gap" style="margin:16px 0 14px">'+
    '<button class="pill'+(at==="li"?' on-li':'')+'" onclick="state.wtab=\'li\';render()">LinkedIn Post</button>'+
    '<button class="pill'+(at==="wa"?' on-wa':'')+'" onclick="state.wtab=\'wa\';render()">WhatsApp Statuses</button>'+
    '<button class="pill'+(at==="ds"?' on-gd':'')+'" onclick="state.wtab=\'ds\';render()">Design Brief</button></div>';

  var detail='';
  if(at==="li"){
    detail='<div class="card" style="margin-bottom:12px;border-left:3px solid #0A66C2;border-radius:0">'+
      '<p class="li-c lbl" style="margin-bottom:6px">Hook</p>'+
      '<p class="semi" style="font-size:15px;font-style:italic;line-height:1.5">'+esc(w.li.hk)+'</p></div>'+
      '<div class="card"><p class="dim lbl" style="margin-bottom:8px">Full copy</p>'+
      '<pre class="muted sm" style="line-height:1.75;white-space:pre-wrap;word-break:break-word;font-family:inherit">'+esc(w.li.cp)+'</pre></div>'+
      '<p class="dim xs" style="margin-top:10px">'+esc(w.li.ht)+'</p>';
  } else if(at==="wa"){
    detail=w.wa.map(function(s){
      return '<div class="card flex" style="gap:14px;align-items:flex-start">'+
        '<div style="background:rgba(37,161,98,.07);color:#25A162;font-size:10px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap;margin-top:2px">'+esc(s.d)+'</div>'+
        '<div style="flex:1"><p class="sm" style="margin-bottom:6px;line-height:1.6">'+esc(s.c)+'</p>'+
        '<p class="dim xs" style="font-style:italic">Design: '+esc(s.s)+'</p></div></div>';
    }).join("");
  } else {
    detail='<div class="card">'+Object.keys(w.li.ds).map(function(k){
      return '<div style="margin-bottom:14px"><p class="gold lbl" style="margin-bottom:4px">'+k+'</p><p class="muted sm lh">'+esc(w.li.ds[k])+'</p></div>';
    }).join("")+'</div>';
  }

  return '<div style="animation:fadeIn .5s">'+pillarsHTML+divHTML+wkSelHTML+badges+title+tabs+detail+'</div>';
}

function renderRhythm(){
  var days=[{d:"MON",li:"Engage — comment on 5 posts",wa:"Text insight status"},{d:"TUE",li:"Publish — main post of the week",wa:"Work photo status"},{d:"WED",li:"Engage — reply to all comments",wa:"Quote or reflection"},{d:"THU",li:"—",wa:"Throwback photo or story"},{d:"FRI",li:"Engage + connect new profiles",wa:"Shoutout or intro status"},{d:"SAT",li:"—",wa:"Personal/life photo"},{d:"SUN",li:"Record next week's coffee prompt",wa:"—"}];
  var stats=[{l:"LinkedIn Posts",v:"8-10/mo",s:"2-3 per week"},{l:"WhatsApp Statuses",v:"25-30/mo",s:"1 per day"},{l:"Introductions",v:"8-10/mo",s:"2 per week"},{l:"AK's Time",v:"~2 hrs/mo",s:"Recording sessions"}];

  return '<div style="animation:fadeIn .5s">'+
    '<p class="muted sm lh" style="margin-bottom:18px">Repeatable weekly cadence. Consistent, not exhausting.</p>'+
    '<div class="card" style="padding:0;overflow:hidden;border-radius:14px">'+
      '<div class="tbl"><div class="hd center" style="font-size:10px;color:#A09A94">DAY</div><div class="hd bl li-c">LINKEDIN</div><div class="hd bl wa-c">WHATSAPP STATUS</div></div>'+
      days.map(function(r,i){
        var off=r.d==="SAT"||r.d==="SUN";
        return '<div class="tbl"><div class="center" style="font-weight:800;font-size:11px;color:'+(off?'#A09A94':'#1A1A1A')+'">'+r.d+'</div>'+
          '<div class="bl" style="color:'+(r.li==="—"?'#A09A94':'#1A1A1A')+'">'+r.li+'</div>'+
          '<div class="bl" style="color:'+(r.wa==="—"?'#A09A94':'#1A1A1A')+'">'+r.wa+'</div></div>';
      }).join("")+'</div>'+
    '<div class="g4" style="margin-top:22px">'+stats.map(function(x){
      return '<div class="card center" style="padding:18px"><p class="serif" style="font-size:28px;font-weight:900">'+x.v+'</p><p class="semi xs" style="margin:4px 0 1px">'+x.l+'</p><p class="dim" style="font-size:10px">'+x.s+'</p></div>';
    }).join("")+'</div></div>';
}
